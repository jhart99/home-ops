---
version: '3'

tasks:

  generate-config:
    desc: Render Talos node configurations and generate talosconfig
    dir: '{{.TALOS_DIR}}'
    cmds:
      - topf render
      - topf talosconfig > {{.TALOSCONFIG}}
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply:
    desc: Apply Talos config to all nodes
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  apply-node:
    desc: Apply Talos config to a single node [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmd: topf apply --nodes-filter '^{{.NODE}}$' --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "auto"}}'
      NODE:
        sh: yq '.nodes[] | select(.ip == "{{.IP}}" or .host == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -n "{{.NODE}}"
      - which topf yq

  upgrade:
    desc: Upgrade Talos across all nodes
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which topf

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmd: topf upgrade --nodes-filter '^{{.NODE}}$'
    vars:
      NODE:
        sh: yq '.nodes[] | select(.ip == "{{.IP}}" or .host == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -n "{{.NODE}}"
      - which topf yq

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: '{{.TALOS_DIR}}'
    cmd: talosctl --nodes {{.CONTROLLER}} upgrade-k8s --to '{{.KUBERNETES_VERSION}}'
    vars:
      CONTROLLER:
        sh: yq '.nodes[] | select(.role == "control-plane") | .ip' {{.TALOS_DIR}}/topf.yaml | head -n1
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  remove-node:
    desc: Remove a Talos node [IP=required]
    dir: '{{.TALOS_DIR}}'
    cmds:
      - kubectl cordon {{.NODE}}
      - kubectl drain {{.NODE}} --ignore-daemonsets --delete-emptydir-data --force
      - kubectl delete node {{.NODE}}
      - topf reset --nodes-filter '^{{.NODE}}$' --graceful=true
    vars:
      NODE:
        sh: yq '.nodes[] | select(.ip == "{{.IP}}" or .host == "{{.IP}}") | .host' {{.TALOS_DIR}}/topf.yaml
    requires:
      vars: [IP]
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -n "{{.NODE}}"
      - which kubectl topf yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: topf reset --graceful=false --full={{if .CLI_FORCE}}true{{else}}false{{end}} --confirm=false
    preconditions:
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf

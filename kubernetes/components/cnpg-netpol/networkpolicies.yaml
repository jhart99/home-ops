---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny.
# Allow SQL clients (${CNPG_CLIENT}) in the same namespace to reach postgres on 5432
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-allow-client-ingress
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: ${APP}
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: ${CNPG_CLIENT}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Allow intra-cluster postgres traffic between instances (streaming replication 5432)
# and instance-manager communication (8000), plus CNPG operator management (8000)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-allow-instance-traffic
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: ${APP}
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: ${APP}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: ${APP}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # CNPG operator reconciles and manages instances over port 8000
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Allow barman-cloud instance sidecar to archive WAL/backups to S3 (s3.rnatr.com via envoy-internal)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-allow-backup-egress
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: ${APP}
  egress:
    - toFQDNs:
        - matchName: s3.rnatr.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Allow kubelet health probes from node
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-allow-kubelet-probes
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: ${APP}
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP

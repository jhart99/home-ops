---
# Allow all pods in this namespace to reach the Kubernetes API server
# Uses toServices to match the kubernetes ClusterIP Service (10.43.0.1)
# as well as direct pod endpoint connections
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-k8s-api
spec:
  endpointSelector: {}
  egress:
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Also allow connections to kube-apiserver pod endpoints directly
    # (covers cases where pods bypass the Service ClusterIP)
    # kube-apiserver pods listen on port 6443
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            component: kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

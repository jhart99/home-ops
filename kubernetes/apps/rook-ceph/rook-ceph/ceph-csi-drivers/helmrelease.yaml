---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  interval: 15m
  dependsOn: []
  values:
    drivers:
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        kernelMountOptions:
          ms_mode: prefer-crc
        nodePlugin:
          serviceAccountName: rook-ceph-cephfs-csi-ceph-com-nodeplugin-sa
        controllerPlugin:
          serviceAccountName: rook-ceph-cephfs-csi-ceph-com-ctrlplugin-sa
      nfs:
        enabled: false
      nvmeof:
        enabled: false
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
        nodePlugin:
          serviceAccountName: rook-ceph-rbd-csi-ceph-com-nodeplugin-sa
        controllerPlugin:
          serviceAccountName: rook-ceph-rbd-csi-ceph-com-ctrlplugin-sa
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement flips on in a follow-up PR for this namespace once the allow-list
# is validated against observed traffic.
# Selector labels verified live on the Deployment pods:
# app.kubernetes.io/name = trust-manager.
# Allow trust-manager to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-manager-allow-dns
  namespace: cert-manager
  annotations:
    # GitOps/audit marker only - Cilium does not read this annotation;
    # spec.enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trust-manager
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow trust-manager to reach the Kubernetes API server: it reads Secrets,
# Certificates and ConfigMaps across namespaces (secretTargets authorizes the
# rnatr-internal-ca secret) and writes TrustBundles
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-manager-allow-k8s-api
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trust-manager
  egress:
    - toEntities:
        - kube-apiserver
---
# kube-apiserver reaches the trust-manager admission webhook: the Service
# targets container port 6443 (verified live)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-manager-allow-webhook
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trust-manager
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# kubelet readiness probe (/readyz on container port 6060) arrives from the node
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-manager-allow-probes
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trust-manager
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6060"
              protocol: TCP

# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement flips on in a follow-up PR for this namespace once the allow-list
# is validated against observed traffic.
# Selector: app.kubernetes.io/instance = cert-manager covers all three pods of
# the release (the chart sets a distinct app.kubernetes.io/name per component:
# cert-manager, cainjector, webhook - verified live), so the instance label is
# the release-wide selector used here.
# Allow the cert-manager release to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-dns
  namespace: cert-manager
  annotations:
    # GitOps/audit marker only - Cilium does not read this annotation;
    # spec.enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow controller, cainjector and webhook to reach the Kubernetes API server
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-k8s-api
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  egress:
    - toEntities:
        - kube-apiserver
---
# ACME and DNS-01 egress: the ClusterIssuer uses the Let's Encrypt production
# directory (HTTPS), the DNS-01 solver calls the Cloudflare API (HTTPS) and the
# chart's dns01RecursiveNameservers resolve over DoH (https://1.1.1.1:443 and
# https://1.0.0.1:443). Port 80 is reserved for HTTP-01 challenges, which no
# current issuer configures.
# TODO(enforce phase): pin toFQDNs to acme-v02.api.letsencrypt.org,
# api.cloudflare.com and the DoH resolvers; drop port 80 if HTTP-01 stays
# unused. Confirm every target against observed Hubble flows first - a miss
# here silently breaks certificate renewals once enforcement flips on.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-acme-egress
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# kube-apiserver reaches the validating/mutating webhook: container port 10250
# (Service targetPort https - verified live)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-webhook
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
# kubelet probes arrive from the node: controller /livez on container port 9403
# (http-healthz) and webhook /livez + /healthz on container port 6080
# (healthcheck). The cainjector Deployment defines no probe port (verified
# live); if one appears before enforcement, add it here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-probes
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9403"
              protocol: TCP
            - port: "6080"
              protocol: TCP
---
# Allow Prometheus to scrape cert-manager metrics: prometheus + servicemonitor
# are enabled in the HelmRelease and all three components expose 9402
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-allow-prometheus-scrape
  namespace: cert-manager
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP

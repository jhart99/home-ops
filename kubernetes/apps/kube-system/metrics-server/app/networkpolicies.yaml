# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy in this file sets spec.enableDefaultDeny to false so the
# selected endpoints do NOT enter default-deny: rules are computed and visible in Hubble, but
# non-matching traffic still passes. Enforcement flips on in a follow-up per-namespace PR once
# the allow-list is validated against observed traffic.
---
# Scrape the kubelet HTTPS API on every node (--kubelet-use-node-status-port -> secure port 10250)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-allow-kubelet-api
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
# Kubelet liveness/readiness probes arrive from the node.
# TODO(enforce phase): pin toPorts to the chart's probed ports - none are stated in repo values.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-allow-kubelet-probes
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  ingress:
    - fromEntities:
        - host
        - remote-node
---
# kube-apiserver aggregates metrics.k8s.io from this pod's HTTPS port.
# TODO(enforce phase): pin toPorts to the metrics-server HTTPS port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server-allow-apiserver-metrics
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  ingress:
    - fromEntities:
        - kube-apiserver

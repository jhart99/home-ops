---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-arc-rebar
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: intel-arc-rebar
  values:
    image:
      repository: ghcr.io/jhart99/intel-arc-rebar
      tag: latest
    gpuMemorySize: "4GB"
    nodeSelector:
      feature.node.kubernetes.io/intel-arc: "true"

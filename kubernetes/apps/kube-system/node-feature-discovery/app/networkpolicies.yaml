# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy in this file sets spec.enableDefaultDeny to false so the
# selected endpoints do NOT enter default-deny: rules are computed and visible in Hubble, but
# non-matching traffic still passes. Enforcement flips on in a follow-up per-namespace PR once
# the allow-list is validated against observed traffic.
---
# Resolve DNS via kube-dns (kube-system local, recorded so the rule exists at enforce time)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery-allow-dns
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Reach the Kubernetes API server (NodeFeature CRs, node updates)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery-allow-k8s-api
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
  egress:
    - toEntities:
        - kube-apiserver
---
# Kubelet liveness/readiness probes arrive from the node.
# TODO(enforce phase): pin toPorts to the chart's probed ports - none are stated in repo values.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery-allow-kubelet-probes
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
  ingress:
    - fromEntities:
        - host
        - remote-node
---
# prometheus.enable in values
# TODO(enforce phase): pin toPorts to the nfd metrics port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery-allow-prometheus-scrape
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
---
# nfd-worker / nfd-gc reach nfd-master over gRPC (chart default :8080). The subcharts label
# master/worker/gc pods differently, so this is scoped by namespace rather than by pod label.
# TODO(enforce phase): confirm :8080 and replace the namespace-wide selector with the
# worker/gc pod labels.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-feature-discovery-allow-master-grpc
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

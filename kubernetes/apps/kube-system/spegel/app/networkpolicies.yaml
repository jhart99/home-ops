# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy in this file sets spec.enableDefaultDeny to false so the
# selected endpoints do NOT enter default-deny: rules are computed and visible in Hubble, but
# non-matching traffic still passes. Enforcement flips on in a follow-up per-namespace PR once
# the allow-list is validated against observed traffic.
---
# Kubelet liveness/readiness probes arrive from the node. This also covers node containerd
# pulling through the registry hostPort (29999 in values), whose traffic arrives from the
# host/remote-node entities.
# TODO(enforce phase): pin toPorts to the probed/registry ports.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spegel-allow-node-access
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spegel
  ingress:
    - fromEntities:
        - host
        - remote-node
---
# Spegel peers exchange registry content and router gossip with each other (registry hostPort
# 29999 in values; router port is chart-default).
# TODO(enforce phase): pin toPorts to the router/registry ports after confirming peer flows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spegel-allow-peers
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spegel
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: spegel
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: spegel

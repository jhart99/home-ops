# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy in this file sets spec.enableDefaultDeny to false so the
# selected endpoints do NOT enter default-deny: rules are computed and visible in Hubble, but
# non-matching traffic still passes. Enforcement flips on in a follow-up per-namespace PR once
# the allow-list is validated against observed traffic.
---
# DELIBERATE CLUSTER-WIDE EXEMPTION (#1539): CoreDNS must stay reachable from every namespace,
# every node and the kube-apiserver. Ingress DNS is therefore allowed from ANY source; an
# ingress rule with no from* clause matches all sources. This is the one intentionally
# unscoped ingress rule in the kube-system rollout.
# Selector is k8s-app: kube-dns (k8sAppLabelOverride in values; guaranteed by the kube-dns
# Service selector).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-allow-dns-ingress
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# CoreDNS forwards queries it does not serve via /etc/resolv.conf; upstream resolvers are
# node-level and not in repo values, and recursion back into the cluster goes via kube-dns.
# TODO(enforce phase): replace world:53 with the observed upstream resolver(s).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-allow-dns-egress
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# The kubernetes plugin watches pods/services/endpoints via the API server
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-allow-k8s-api
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - kube-apiserver
---
# health (:8080) and ready (:8181) plugin defaults (not overridden in values) are what kubelet probes
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-allow-kubelet-probes
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8181"
              protocol: TCP
---
# Prometheus plugin exposes metrics on 0.0.0.0:9153 (values)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-allow-prometheus-scrape
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP

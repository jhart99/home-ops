# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy in this file sets spec.enableDefaultDeny to false so the
# selected endpoints do NOT enter default-deny: rules are computed and visible in Hubble, but
# non-matching traffic still passes. Enforcement flips on in a follow-up per-namespace PR once
# the allow-list is validated against observed traffic.
# Selector note: the chart name (gpu-operator) differs from the release name, so these
# policies select on app.kubernetes.io/instance = release name. Only the operator manager
# runs (devicePlugin/driver/gfd/dcgmExporter/toolkit/nfd/migManager all disabled in values).
---
# Resolve DNS via kube-dns (kube-system local, recorded so the rule exists at enforce time)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nvidia-gpu-operator-allow-dns
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: nvidia-gpu-operator
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Reach the Kubernetes API server (operator watches ClusterPolicy CRs and node state)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nvidia-gpu-operator-allow-k8s-api
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: nvidia-gpu-operator
  egress:
    - toEntities:
        - kube-apiserver
---
# Kubelet liveness/readiness probes arrive from the node.
# TODO(enforce phase): pin toPorts to the chart's probed ports - none are stated in repo values.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nvidia-gpu-operator-allow-kubelet-probes
  namespace: kube-system
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: nvidia-gpu-operator
  ingress:
    - fromEntities:
        - host
        - remote-node

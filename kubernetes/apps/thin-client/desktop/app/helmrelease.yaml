---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: desktop
spec:
  chartRef:
    kind: OCIRepository
    name: desktop
  interval: 1h
  values:
    controllers:
      desktop:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/webtop
              tag: alpine-xfce
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: America/New_York
              # CUSTOM_PORT: "3000"
              # CUSTOM_HTTPS_PORT: "3001"
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            securityContext:
              seccompProfile:
                type: Unconfined
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      app:
        ports:
          http:
            port: 3000
          https:
            port: 3001
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "desktop.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
    persistence:
      config:
        existingClaim: desktop
        globalMounts:
          - path: /config

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netboot
spec:
  chartRef:
    kind: OCIRepository
    name: netboot
  interval: 1h
  values:
    controllers:
      netboot:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          http:
            image:
              repository: ghcr.io/netbootxyz/netbootxyz
              tag: 0.7.6-nbxyz3
            env:
              TZ: America/New_York
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.1.70"
        ports:
          http:
            port: 3000
          tftp:
            port: 69
            protocol: UDP
    route:
      app:
        hostnames:
          - "netboot.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 3000
    persistence:
      config:
        type: configMap
        name: netboot-ipxe
        globalMounts:
          - path: /config/menus/custom
            readOnly: true

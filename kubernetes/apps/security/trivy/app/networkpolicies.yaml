# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): enableDefaultDeny false on every policy - observation only.
# trivy-operator: heavy k8s-api consumer; scan jobs + node collector are separate
# pods with their own labels - TODO(enforce phase): extend selectors to scan-job
# pods once their labels are confirmed in Hubble.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-allow-egress
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  egress:
    # vulnerability/DB downloads for scans (ghcr.io, public.ecr.io, aquasecurity)
    # TODO(enforce phase): pin toFQDNs observed in Hubble.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator-allow-ingress
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
  ingress:
    # kubelet probes (port 9090)
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

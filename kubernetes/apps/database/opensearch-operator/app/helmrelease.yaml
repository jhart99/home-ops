---
# yaml-language-server: $schema=https://k8s-schemas.erwanleboucher.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch-operator
spec:
  interval: 15m
  chart:
    spec:
      chart: opensearch-operator
      version: 3.0.14
      sourceRef:
        kind: HelmRepository
        name: opensearch-operator
  values:
    nodeSelector:
      kubernetes.io/arch: amd64
    securityContext:
      runAsNonRoot: true
    manager:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          cpu: 1000m
          memory: 500Mi
        requests:
          cpu: 200m
          memory: 350Mi
      dnsBase: cluster.local
      metricsBindAddress: 127.0.0.1:8080
    installCRDs: true
    webhook:
      enabled: true
      port: 9443
      failurePolicy: Fail
      certManager:
        enabled: true

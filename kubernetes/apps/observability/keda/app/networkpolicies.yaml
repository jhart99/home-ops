---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow keda (operator, metrics-apiserver and admission webhooks) to resolve
# DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-dns
  namespace: observability
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow keda to reach the Kubernetes API server (HPAs, ScaledObjects,
# workloads in every namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-k8s-api
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow keda's scaler traffic to the scale targets it watches. The target set
# spans namespaces and protocols (HTTP/apiserver/prometheus scalers) and is not
# knowable from this repo.
# TODO(enforce phase): pin to the observed scale-target endpoints and ports.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-scaler-egress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda
  egress:
    - toEntities:
        - cluster
---
# Allow kube-apiserver access to the keda admission webhooks (values:
# prometheus.webhooks.enabled, standard webhook port 9443) and to the
# external-metrics APIService backed by keda-metrics-apiserver (:443).
# TODO(enforce phase): confirm the webhook and metrics-apiserver ports in
# Hubble and split these rules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-apiserver-ingress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# Allow kubelet probes from the node and Prometheus scraping of the three
# serviceMonitors (metricServer / operator / webhooks).
# TODO(enforce phase): pin the probe and metrics ports in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-probes-scrape
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keda
  ingress:
    - fromEntities:
        - host
        - remote-node
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability

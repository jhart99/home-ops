---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow keda (operator, metrics-apiserver and admission webhooks) to resolve
# DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-dns
  namespace: observability
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow return traffic from kube-dns (same-node DNAT reply)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-dns-return
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
---
# Allow keda to reach the Kubernetes API server (HPAs, ScaledObjects,
# workloads in every namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-k8s-api
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow keda's scaler traffic to the scale targets it watches.
# In this cluster, ScaledObjects use Prometheus as the trigger.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-scaler-egress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Allow kube-apiserver access to the keda admission webhooks (:9443) and
# to the external-metrics APIService backed by keda-metrics-apiserver (:6443 / :443).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-apiserver-ingress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# Allow kubelet probes from the node and Prometheus scraping of the three
# serviceMonitors (metricServer / operator / webhooks).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-allow-probes-scrape
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-operator
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "9666"
              protocol: TCP

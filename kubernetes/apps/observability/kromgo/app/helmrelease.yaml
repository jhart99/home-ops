---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  chartRef:
    kind: OCIRepository
    name: kromgo
  interval: 1h
  values:
    controllers:
      kromgo:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/kashalls/kromgo
              tag: v0.10.0@sha256:965ecc92d68dc1a4a969397855367bbc70da03227a941ea607b73bb7e0b78fd6
            env:
              PROMETHEUS_URL: http://prometheus-operated.observability.svc.cluster.local:9090
              SERVER_PORT: &port 80
              HEALTH_PORT: &healthPort 8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *healthPort
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
          health:
            port: *healthPort
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          # SECURITY (#1426): deny ?format=raw — its response includes
          # full Prometheus label sets (pod names, internal pod/node IPs,
          # namespaces), which is more than the badge values this
          # endpoint is deliberately published for. No backendRefs means
          # the gateway itself answers without forwarding to kromgo
          # (Gateway API conformance test HTTPRouteNoBackendRefs expects
          # 404/500 here). The value is a regex because Envoy matches
          # query strings verbatim while kromgo (Go) percent-decodes
          # them: the alternatives enumerate every single-encoding
          # spelling of "raw" that Go decodes to exactly "raw" (the hex
          # digits 72/61/77 contain no letters, so there are no case
          # variants). Envoy Gateway evaluates this rule before the
          # catch-all below — rules with query-param matches sort first.
          - matches:
              - path:
                  type: PathPrefix
                  value: /
                queryParams:
                  - name: format
                    type: RegularExpression
                    value: "^(raw|%72aw|r%61w|ra%77|%72%61w|%72a%77|r%61%77|%72%61%77)$"
          # Accepted public surface (#1426 / SECURITY_AUDIT.md #10):
          # read-only badge JSON for the metrics preconfigured in
          # resources/config.yaml — this is what the README's
          # shields.io badges consume. Anything not matching the deny
          # rule above falls through here to kromgo, which only serves
          # GET on metric names (everything else 404/405 in-app).
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      config-file:
        type: configMap
        name: kromgo-configmap
        globalMounts:
          - path: /kromgo/config.yaml
            subPath: config.yaml

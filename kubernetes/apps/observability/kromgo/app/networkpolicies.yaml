---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow kromgo to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kromgo-allow-dns
  namespace: observability
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow kromgo to query Prometheus (PROMETHEUS_URL env in the HelmRelease:
# prometheus-operated.observability:9090).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kromgo-allow-prometheus-egress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo
  egress:
    - toServices:
        - k8sService:
            serviceName: prometheus-operated
            namespace: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Allow the kromgo badge surface (app-template port 80, kromgo.${SECRET_DOMAIN}
# HTTPRoute on envoy-external) from the envoy proxies in the network namespace,
# plus kubelet probes on the health port 8080 (/readyz).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kromgo-allow-http-ingress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow the silence-operator to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silence-operator-allow-dns
  namespace: observability
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silence-operator
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow the silence-operator to reach the Kubernetes API server (it watches
# Silence CRs in every namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silence-operator-allow-k8s-api
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silence-operator
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow the silence-operator to manage silences via the alertmanager API
# (alertmanagerAddress in the HelmRelease:
# http://kube-prometheus-stack-alertmanager:9093).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silence-operator-allow-alertmanager-egress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silence-operator
  egress:
    - toServices:
        - k8sService:
            serviceName: kube-prometheus-stack-alertmanager
            namespace: observability
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# Allow kubelet probes from the node.
# TODO(enforce phase): pin the operator probe port in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silence-operator-allow-kubelet-probes
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silence-operator
  ingress:
    - fromEntities:
        - host
        - remote-node

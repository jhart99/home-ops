---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow gatus health-check probes: it checks every discovered HTTPRoute/SVC in
# the cluster plus the external endpoints configured in resources/config.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus-allow-probe-egress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  egress:
    - toEntities:
        - cluster
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "1883"
              protocol: TCP
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
        - cluster
      icmps:
        - fields:
            - type: 8
              family: IPv4
---
# Allow return traffic from ICMP pings
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus-allow-return-ingress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  ingress:
    - fromEntities:
        - world
        - cluster
      icmps:
        - fields:
            - type: 0
              family: IPv4
---
# Allow the gatus web UI (app-template port 80, /health probes):
#   - from the envoy-internal proxies (gatus.${SECRET_DOMAIN} /
#     status.${SECRET_DOMAIN} HTTPRoutes);
#   - from the node for kubelet probes;
#   - from Prometheus (serviceMonitor endpoint port http).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus-allow-http-ingress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

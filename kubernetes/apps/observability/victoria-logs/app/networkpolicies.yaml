---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow the victoria-logs server to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-allow-dns
  namespace: observability
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow ingress to victoria-logs on 9428:
#   - from fluent-bit (both http outputs in its HelmRelease);
#   - from the envoy-internal proxies (victoria-logs.${SECRET_DOMAIN} HTTPRoute,
#     including the / -> /select/vmui redirect);
#   - from the node for kubelet probes.
# TODO(enforce phase): pin the in-cluster writer set (today fluent-bit; expect
# it to stay the only writer, with readers going through grafana later).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-allow-ingress
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
# Allow Prometheus to scrape the victoria-logs server (serviceMonitor enabled,
# port 9428).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs-allow-prometheus-scrape
  namespace: observability
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP

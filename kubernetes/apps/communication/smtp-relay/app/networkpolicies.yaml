# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow smtp-relay to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay-allow-dns
  namespace: communication
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow smtp-relay egress to the upstream SMTP relay (maddy target.smtp,
# STARTTLS, port 587).
# TODO(enforce phase): pin toFQDNs to SMTP_RELAY_SERVER once its value is known
# (lives in the SOPS secret); world:587 is the audit-phase approximation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay-allow-upstream
  namespace: communication
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
---
# Allow LAN SMTP clients to the LoadBalancer (192.168.30.30:25,
# externalTrafficPolicy Local preserves the real client source IP).
# TODO(enforce phase): confirm the client CIDR in Hubble and tighten.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smtp-relay-allow-smtp-ingress
  namespace: communication
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp-relay
  ingress:
    - toCIDR:
        - 192.168.30.0/24
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
    # kubelet liveness/readiness probes arrive from the node
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP

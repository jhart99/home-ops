---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 30m
  values:
    fullnameOverride: renovate-operator
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
    policy:
      enabled: true
      allowedHosts:
        - api.github.com
        - github.com
        - forgejo.rnatr.com
        - forgejo
        - forgejo.default
        - forgejo.default.svc.cluster.local
    route:
      enabled: true
      hostnames: ["renovate.${SECRET_DOMAIN}"]
      parentRefs:
        - name: envoy-internal
          namespace: network
    valkey:
      existingSecret: "renovate-operator-secret"
      existingSecretKey: "dragonfly_url"
    webhook:
      enabled: true
      # Explicit WEBHOOK_BASE_URL. The chart used to derive this from
      # route.enabled + route.hostnames, but the chart-managed route is now
      # disabled in favor of the scoped HTTPRoute in ./httproute.yaml;
      # without the override, auto webhook sync would register URLs with no
      # host. Value is identical to the previously derived URL, so existing
      # GitHub/Forgejo webhook registrations are unaffected.
      baseUrl: "https://renovate-webhook.${SECRET_DOMAIN}"
      route:
        # Replaced by ./httproute.yaml (POST /webhook/ only, instead of the
        # chart's catch-all PathPrefix /). hostnames/parentRefs kept below
        # for reference if the chart-managed route is ever re-enabled.
        enabled: false
        hostnames: ["renovate-webhook.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network

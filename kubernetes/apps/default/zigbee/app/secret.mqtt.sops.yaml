apiVersion: v1
kind: Secret
metadata:
    name: zigbee-mqtt-secret
type: Opaque
stringData:
    # PLACEHOLDER — must match a user in the mosquitto password file, then encrypt:
    #   sops --encrypt --in-place kubernetes/apps/default/zigbee/app/secret.mqtt.sops.yaml
    ZIGBEE2MQTT_CONFIG_MQTT_USER: "REPLACE_WITH_MQTT_USERNAME"
    ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: "REPLACE_WITH_MQTT_PASSWORD"

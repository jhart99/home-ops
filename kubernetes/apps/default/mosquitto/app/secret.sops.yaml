apiVersion: v1
kind: Secret
metadata:
    name: mosquitto-secret
type: Opaque
stringData:
    # PLACEHOLDER — replace with the output of `mosquitto_passwd -c passwd <username>`
    # (eclipse-mosquitto image ships mosquitto_passwd), then encrypt before merging:
    #   sops --encrypt --in-place kubernetes/apps/default/mosquitto/app/secret.sops.yaml
    passwd: "REPLACE_WITH_MOSQUITTO_PASSWD_OUTPUT_user_colon_hash_per_line"

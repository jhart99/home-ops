# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pihole-allow-dns
  namespace: default
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pihole
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# FTL forwards unresolved queries to the configured upstream resolvers.
# TODO(enforce phase): pin world:53/853 to the upstream resolver CIDR (or DoT endpoint)
# observed in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pihole-allow-upstream-dns
  namespace: default
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pihole
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "853"
              protocol: TCP
---
# Ingress: LAN clients use the LoadBalancer for DNS (53 udp/tcp) and the admin UI (80),
# envoy-internal serves the route (80), other cluster pods may use pihole as resolver,
# kubelet probes /metrics on the exporter (9617).
# TODO(enforce phase): confirm whether cluster pods really query pihole:53 and scope it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pihole-allow-ingress
  namespace: default
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pihole
  ingress:
    - toCIDR:
        - 192.168.30.0/24
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
            - port: "80"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # kubelet liveness probes (/metrics on 9617) arrive from the node
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9617"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# Prometheus (ServiceMonitor, endpoint port prometheus = 9617) scrapes /metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pihole-allow-prometheus-scrape
  namespace: default
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pihole
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9617"
              protocol: TCP

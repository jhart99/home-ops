# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
# endpointSelector covers the immich server AND immich-machine-learning (both carry
# app.kubernetes.io/name: immich); the CNPG pods (postgresql) are deliberately excluded.
---
# DB_URL -> immich-db (CNPG, 5432), REDIS_HOSTNAME -> immich-dragonfly (6379),
# machine-learning service (3003); the machine-learning replica fetches model weights over HTTPS.
# TODO(enforce phase): pin world:443 to the model/HuggingFace FQDNs seen in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-allow-egress
  namespace: default
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: immich-db-rw
            namespace: default
        - k8sService:
            serviceName: immich-db-r
            namespace: default
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: immich-dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: immich-dragonfly
            namespace: default
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich
            app.kubernetes.io/controller: machine-learning
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: immich-machine-learning
            namespace: default
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
---
# Ingress: envoy-internal serves immich.${SECRET_DOMAIN} (2283), machine-learning serves (3003),
# kubelet probes /ping on machine-learning (3003), the server is probed on 2283 when probes are enabled.
# Same-node RevNAT return traffic from immich-db is allowed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-allow-ingress
  namespace: default
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    # Immich server -> machine-learning communication on port 3003
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich
            app.kubernetes.io/controller: immich
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
    # kubelet liveness/readiness probes (ml: /ping on 3003, server: 2283) from the node
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3003"
              protocol: TCP
            - port: "2283"
              protocol: TCP
    # Same-node RevNAT return traffic from immich-db
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-db
---
# Prometheus (ServiceMonitor endpoints metrics-api + metrics-ms) scrapes 8081/8082.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich-allow-prometheus-scrape
  namespace: default
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP

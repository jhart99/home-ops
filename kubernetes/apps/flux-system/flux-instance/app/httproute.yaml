---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-webhook
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 404"]
spec:
  hostnames: ["flux-webhook.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: webhook-receiver
          namespace: flux-system
          port: 80
      matches:
        # The receiver only accepts POST deliveries (ping/push events from
        # GitHub). Restricting the method means GETs, probes and other verbs
        # on /hook/ are answered with a 404 at the gateway and never reach
        # the flux webhook-receiver service. The path was already scoped to
        # /hook/ — this closes the method gap flagged in the audit (#1448).
        - path:
            type: PathPrefix
            value: /hook/
          method: POST

# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow the kopia repository server to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopia-allow-dns
  namespace: volsync-system
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopia
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow HTTP ingress to the kopia server (kopia web UI, port 80, started with
# --without-password):
#   - from the envoy-internal HTTPRoute (kopia.${SECRET_DOMAIN}) in the
#     network namespace;
#   - from in-cluster clients, e.g. volsync kopia mover pods in application
#     namespaces - the caller set is not knowable from this repo;
#   - from the node for kubelet liveness/readiness probes.
# TODO(enforce phase): confirm the caller set in Hubble and tighten (split the
# in-cluster `cluster` rule down to the actual mover namespaces / an entity or
# FQDN list).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kopia-allow-http-ingress
  namespace: volsync-system
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopia
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
# NOTE(enforce phase): the kopia repository itself is an NFS volume
# (pve.jonathanrosshart.com:/pool/k8s/volsync) mounted into this pod by the
# kubelet on the node. NFS traffic does not traverse the pod network namespace,
# so no pod-level egress rule can cover or restrict it - it is a node-level
# concern to track separately in the enforce design pass, not a missing rule
# here.

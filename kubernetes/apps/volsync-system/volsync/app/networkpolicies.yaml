# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow the volsync operator to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: volsync-allow-dns
  namespace: volsync-system
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: volsync
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow the volsync operator to reach the Kubernetes API. It watches
# ReplicationSource/ReplicationDestination/KopiaMaintenance CRs in every
# namespace and spawns mover Jobs there (mover pods do NOT run in this
# namespace, so their backup-target egress is out of scope for these policies).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: volsync-allow-k8s-api
  namespace: volsync-system
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: volsync
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow Prometheus (observability) to scrape the operator metrics endpoint
# (metrics.disableAuth: true in the HelmRelease).
# TODO(enforce phase): confirm the metrics port (volsync operator default 8443)
# in Hubble before enforcing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: volsync-allow-prometheus-scrape
  namespace: volsync-system
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: volsync
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP

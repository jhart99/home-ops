---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow the atuin server to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atuin-allow-dns
  namespace: development
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: atuin
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow the atuin HTTP surface (app-template port 80, /healthz):
#   - from the envoy-internal HTTPRoute (atuin.${SECRET_DOMAIN}) proxies in the
#     network namespace;
#   - from the node for kubelet liveness/readiness/startup probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atuin-allow-http-ingress
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: atuin
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# Allow the atuin volsync kopia mover (Jobs spawned in this namespace by the
# volsync operator) to reach the kopia repository server in volsync-system.
# TODO(enforce phase): confirm mover->kopia flows in Hubble (kopia repo server
# HTTP port 80) and pin the mover pod selector (mover pods are labeled by
# volsync, not by this app).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atuin-allow-volsync-kopia-egress
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: atuin
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: volsync-system
            app.kubernetes.io/name: kopia
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

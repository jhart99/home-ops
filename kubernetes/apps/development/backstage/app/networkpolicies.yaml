---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# Allow the backstage backend to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-allow-dns
  namespace: development
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow backstage to reach the Kubernetes API server (entity lookups, catalog
# integrations).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-allow-k8s-api
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow backstage to fetch catalog locations over HTTPS (the in-repo values
# point at github.com catalog targets; the exact provider set is not knowable
# from this repo).
# TODO(enforce phase): tighten `world` to the concrete git-provider FQDNs
# (github.com / forgejo) observed in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-allow-git-egress
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Allow backstage to reach its PostgreSQL database, a CloudNativePG cluster
# (backstage-db) that lives in this same namespace; the connection host comes
# from the backstage-db-app secret.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-allow-postgres-egress
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: development
            cnpg.io/cluster: backstage-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Allow the backstage backend (container port 7007, HTTPRoute backend of
# backstage.${SECRET_DOMAIN}):
#   - from the envoy-internal proxies in the network namespace;
#   - from the node for kubelet probes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-allow-http-ingress
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "7007"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "7007"
              protocol: TCP
---
# Allow Prometheus to scrape the backstage backend metrics
# (metrics.serviceMonitor.enabled: true, path /metrics on the backend port).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backstage-allow-prometheus-scrape
  namespace: development
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: backstage
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "7007"
              protocol: TCP

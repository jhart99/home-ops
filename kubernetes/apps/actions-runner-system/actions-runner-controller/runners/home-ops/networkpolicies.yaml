# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement flips on in a follow-up PR for this namespace once the allow-list
# is validated against observed traffic.
# Selector: app.kubernetes.io/name = home-ops-runner-set covers both the
# listener pod and the runner pods (component labels runner and
# runner-scale-set-listener) - verified live; the label is the chart's
# runnerScaleSetName.
# Allow the listener and runner pods to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-ops-runner-set-allow-dns
  namespace: actions-runner-system
  annotations:
    # GitOps/audit marker only - Cilium does not read this annotation;
    # spec.enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-ops-runner-set
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow runner pods to reach the Kubernetes API server: with
# containerMode.type kubernetes the runner service account
# (home-ops-runner-rbac) creates and watches the per-job pods
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-ops-runner-set-allow-k8s-api
  namespace: actions-runner-system
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-ops-runner-set
  egress:
    - toEntities:
        - kube-apiserver
---
# Wide audit-phase egress: this is the most permissive namespace on purpose -
# runners need container registry pulls (ghcr.io), the GitHub runner download
# and API, and arbitrary CI egress; the listener polls GitHub over HTTPS.
# TODO(enforce phase): replace world (no toPorts) with the concrete rule after
# observing real flows in Hubble - expected split is registry (443), github.com
# / api.github.com (443), plus whatever the CI jobs actually reach; also verify
# any node/host traffic (the runner env NODE=status.hostIP) while observing.
# world with no toPorts cannot drop traffic while enableDefaultDeny is false.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-ops-runner-set-allow-egress
  namespace: actions-runner-system
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-ops-runner-set
  egress:
    - toEntities:
        - world

---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: nemotron-3-5-lightning
spec:
  source: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  format: safetensors
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 0
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimName: gpu-claim
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: nemotron-3-5-lightning
spec:
  modelRef: nemotron-3-5-lightning
  runtime: vllm

  # Image override directly in the spec ensures we use the exact vLLM build
  # needed for these specific MoE/Mamba features.
  image: "vllm/vllm-openai:v0.27.1"

  # extraArgs is the v0.9.x method for passing arbitrary flags to the backend
  extraArgs:
    - "--served-model-name=nemotron-3.5-lightning"
    - "--moe-backend=humming"
    - "--linear-backend=humming"
    - "--max-num-seqs=256"
    - "--max-model-len=65536"
    - "--max-num-batched-tokens=32768"
    - "--enable-prefix-caching"
    - "--async-scheduling"
    - "--mamba-backend=flashinfer"
    - "--mamba-ssm-cache-dtype=float16"
    - "--enable-mamba-cache-stochastic-rounding"
    - "--mamba-cache-philox-rounds=5"
    - "--mamba-cache-mode=align"
    - "--mamba-ssu-algorithm=horizontal"
    - "--reasoning-parser=nemotron_v3"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser=qwen3_coder"
  replicas: 1
  runtimeClassName: nvidia
  contextSize: 1000000
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 1024
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    cpu: "500m"
    memory: 32Gi
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
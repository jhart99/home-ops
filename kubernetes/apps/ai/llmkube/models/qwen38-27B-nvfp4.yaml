# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-27b-nvfp4
spec:
  source: hf://unsloth/Qwen3.8-27B-NVFP4
  format: safetensors
  quantization: NVFP4
  files:
    - config.json # the primary: must match exactly one file
    - "*.json"
    - "*.jinja"
    - "*.safetensors"
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 0
      layers: -1
      resourceClaims:
        - name: gpu
          resourceClaimName: gpu-claim
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38-27b-nvfp4
spec:
  modelRef: qwen38-27b-nvfp4
  runtime: vllm
  runtimeClassName: nvidia
  image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
  replicas: 1
  vllmConfig:
    quantization: compressed-tensors
    maxModelLen: 131072
    kvCacheDtype: fp8
    gpuMemoryUtilization: 0.55
    tensorParallelSize: 1
    enablePrefixCaching: true
    enableChunkedPrefill: true
    toolCallParser: qwen3_coder
    reasoningParser: qwen3
    speculative:
      enabled: true
      method: mtp
      numSpeculativeTokens: 5
  resources:
    cpu: "1"
    memory: 78Gi
    memoryLimit: 84Gi
  endpoint:
    port: 8000
    type: ClusterIP
  env:
    - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
      value: "0"
    - name: TRITON_CACHE_DIR
      value: /root/.cache/triton
  extraArgs:
    - --max-num-seqs
    - "4"
    - --served-model-name
    - qwen38-27b-nvfp4
    - --language-model-only
    - --override-generation-config
    - '{"temperature": 0.6, "top_k": 20, "top_p": 0.95}'
  extraVolumes:
    - name: vllm-cache
      persistentVolumeClaim:
        claimName: llmkube-models
  extraVolumeMounts:
    - name: vllm-cache
      mountPath: /root/.cache
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6

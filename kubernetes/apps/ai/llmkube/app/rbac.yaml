---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmkube-leader-election-role
  namespace: ai
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmkube-leader-election-rolebinding
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmkube-leader-election-role
subjects:
- kind: ServiceAccount
  name: llmkube-controller-manager
  namespace: ai
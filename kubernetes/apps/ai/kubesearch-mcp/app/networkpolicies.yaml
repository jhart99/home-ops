# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# kubesearch indexes/searches Kubernetes objects, queries kubesearch.dev, and clones
# public repositories via Git over HTTPS. ToolHive proxy (8080) talks to backend pod (3000).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubesearch-allow-egress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      toolhive-name: kubesearch-mcp
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP

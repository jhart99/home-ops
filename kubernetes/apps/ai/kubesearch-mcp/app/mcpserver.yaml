---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name kubesearch-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Kubesearch"
    toolhive.stacklok.dev/registry-url: "http://mcp-kubesearch-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "Search public k8s-at-home Flux HelmReleases, chart values, and community homelab repository patterns."
    toolhive.stacklok.dev/tools: |
      ["kubesearch_search_releases","kubesearch_get_release","kubesearch_search_images","kubesearch_grep_values","kubesearch_status","repo_clone","repo_list_files","repo_read_file","repo_grep","repo_grep_all","repo_cleanup"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"kubesearch_search_releases","description":"Search kubesearch.dev for Flux HelmReleases / Argo Applications by chart name (substring, case-insensitive). Mirrors the kubesearch.dev homepage search (e.g...."},{"name":"kubesearch_get_release","description":"Get details for one chart by its kubesearch.dev release id (the `id` from `kubesearch_search_releases`, e.g. 'ghcr.io-home-operations-charts-mirror-cert-mana..."},{"name":"kubesearch_search_images","description":"Search kubesearch.dev for container image repositories used across public home-ops clusters (substring match on the image repository, case-insensitive). Retu..."},{"name":"kubesearch_grep_values","description":"Full-text grep across the Helm `spec.values` of every indexed HelmRelease/Application (substring match). Great for finding real-world examples of a config ke..."},{"name":"kubesearch_status","description":"Report the freshness and size of the locally cached kubesearch.dev data: the release tag (date), when it was loaded, the cache directory, and row counts. Use..."},{"name":"repo_clone","description":"Temporarily clone a public Git repository so you can review its actual files. Accepts an indexed home-ops repo name (e.g. 'onedr0p/home-ops' \u2014 resolved to it..."},{"name":"repo_list_files","description":"List files in a previously cloned repository (by `handle`). Optionally scope to a sub-path and/or filter with a glob (e.g. '**/*.yaml', 'kubernetes/**'). Use..."},{"name":"repo_read_file","description":"Read a text file from a previously cloned repository (by `handle` and relative `path`). Binary files are refused and large files are truncated. Use the handl..."},{"name":"repo_grep","description":"Search the text contents of a previously cloned repository (by `handle`) for a substring. Optionally restrict to files matching a glob. Returns file paths, l..."},{"name":"repo_grep_all","description":"Substring-search the actual files of the most popular indexed home-ops repositories at once \u2014 no clone step needed. The server keeps these repos permanently..."},{"name":"repo_cleanup","description":"Delete a temporary clone created by `repo_clone` (frees disk before its TTL). Clones are also auto-deleted after inactivity, so this is optional but polite."}]
spec:
  image: ghcr.io/perfectra1n/kubesearch-mcp:1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
  transport: streamable-http
  mcpPort: &port 3000
  groupRef:
    name: mcp-tools
  env:
    - name: KUBESEARCH_REFRESH_HOURS
      value: "24"
  toolConfigRef:
    name: *name
  podTemplateSpec:
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mcp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: mcp
              containerPort: *port
          startupProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: kubesearch-mcp
spec:
  toolsFilter: []
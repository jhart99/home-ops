# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-allow-dns
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: searxng-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# SearXNG MCP server connects to SearXNG (searxng.ai.svc:8080) and fetches URLs from
# the web over HTTP/HTTPS. ToolHive proxy connects to kube-apiserver and forwards to
# the backend MCP pod on 8080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-allow-egress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: searxng-mcp
  egress:
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
    - toEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            toolhive-name: searxng-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# kubelet /health probes (8080) from the node; toolhive gateways call the server.
# TODO(enforce phase): scope the cluster rule to the toolhive gateway/vmcp endpoints.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-allow-ingress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: searxng-mcp
  ingress:
    # DNS return replies from kube-dns on ephemeral client ports
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: virtualmcpserver
        - matchLabels:
            app.kubernetes.io/name: hermes
        - matchLabels:
            toolhive-name: searxng-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

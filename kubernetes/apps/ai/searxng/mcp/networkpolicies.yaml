# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# SearXNG MCP server connects to SearXNG (searxng.ai.svc:8080) and fetches URLs from
# the web over HTTP/HTTPS. ToolHive proxy connects to kube-apiserver and forwards to
# the backend MCP pod on 8080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-mcp-allow-egress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      toolhive-name: searxng-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP

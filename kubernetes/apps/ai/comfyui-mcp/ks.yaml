---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: comfyui-mcp
spec:
  dependsOn:
    - name: toolhive-crds
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/comfyui-mcp/app
  postBuild:
    substitute:
      APP: comfyui-mcp
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
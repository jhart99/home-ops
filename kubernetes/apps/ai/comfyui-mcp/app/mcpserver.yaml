---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: comfyui-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "ComfyUI"
    toolhive.stacklok.dev/registry-url: "http://mcp-comfyui-mcp-proxy.ai.svc.cluster.local:80/mcp"
    toolhive.stacklok.dev/registry-description: "MCP server for ComfyUI enabling image generation, workflow inspection, model discovery, and queue management."
    toolhive.stacklok.dev/tools: |
      ["comfy_cli","enqueue_workflow","get_system_stats","visualize_workflow","create_workflow","queue","search_custom_nodes","download_model","list_local_models","get_history","runpod","runpod_watch","get_workflow","save_workflow","restart_comfyui","get_image","upload_image","clear_vram","get_defaults","generate_image","node_snapshot","bisect","install_custom_node","report_issue","install_comfyui","model_metadata","workspace","list_api_nodes","node_pack","apply_manifest","list_packs","calculate","train_prepare_dataset","train_start","train_doctor","apps","batch","kitchen","list_tools","describe_tool","call_tool"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"comfy_cli","description":"Drive the official comfy-cli (envelope/1 JSON contract) for the selected ComfyUI environment. The MCP resolves `comfy` from COMFY_CLI_PATH, PATH, or the sele..."},{"name":"enqueue_workflow","description":"Submit work to the ComfyUI execution queue \u2014 the primary way an agent starts a render. Driven by the `action` parameter:"},{"name":"get_system_stats","description":"Inspect the connected ComfyUI server: what it is running on, what it has logged, and whether it is healthy enough to dispatch work to. All three actions are..."},{"name":"visualize_workflow","description":"DRAW a diagram of, or convert, workflow JSON you PASS IN (a JSON string or object) \u2014 it does NOT read the user's live canvas, so for 'show me what's on the c..."},{"name":"create_workflow","description":"Author and check ComfyUI workflow JSON. Driven by the `action` parameter:"},{"name":"queue","description":"Inspect and manage the ComfyUI execution queue. Driven by the `action` parameter:"},{"name":"search_custom_nodes","description":"Discover ComfyUI custom node PACKS in the public ComfyUI Registry (registry.comfy.org). Read-only and network-only: queries the hosted registry over HTTP and..."},{"name":"download_model","description":"Find model weights and get them onto the connected ComfyUI, and track the transfers. Driven by the `action` parameter:"},{"name":"list_local_models","description":"Inspect what models this ComfyUI has installed, and where it looks for them. Driven by the `action` parameter:"},{"name":"get_history","description":"Read what has already been generated on this machine \u2014 execution history, why a run failed, and the settings your past renders actually used. Driven by the `..."},{"name":"runpod","description":"Deploy, start, stop, inspect and connect to RunPod cloud GPU pods, and switch rendering between your local machine and a pod. Driven by the `action` paramete..."},{"name":"runpod_watch","description":"Watch a RunPod pod's live status in the control panel, stop watching it, or diagnose why it isn't usable. Driven by the `action` parameter. None of these act..."},{"name":"get_workflow","description":"Return, list, summarize or query a SAVED workflow FILE \u2014 files on disk, named from the library or given as a path/JSON \u2014 NOT the graph open on the user's can..."},{"name":"save_workflow","description":"WRITE to the ComfyUI user library: persist a workflow, or capture/verify its provenance lock. This is the only tool here that writes \u2014 reading is get_workflo..."},{"name":"restart_comfyui","description":"Control the lifecycle of the ComfyUI server process. Driven by the `action` parameter:"},{"name":"get_image","description":"Fetch, browse and inspect ComfyUI images and registered assets. Driven by the `action` parameter:"},{"name":"upload_image","description":"Put a file where ComfyUI (or cloud storage) can read it. Driven by the `action` parameter:"},{"name":"clear_vram","description":"Free GPU VRAM by unloading cached models from ComfyUI. Use this between generation runs with different model families (e.g. switching from SDXL to Flux) or w..."},{"name":"get_defaults","description":"Read and write settings \u2014 either OUR generation defaults or ComfyUI's own frontend UI settings. These are two SEPARATE stores and the `action` says which one..."},{"name":"generate_image","description":"Generate media from a prompt or an existing image \u2014 the high-level entry points that build the graph for you. Every action enqueues on the connected ComfyUI..."},{"name":"node_snapshot","description":"Custom-node snapshots via ComfyUI-Manager (mirrors `comfy node save-snapshot` / `restore-snapshot`). Driven by the `action` parameter:"},{"name":"bisect","description":"Binary-search (git-bisect style) over installed ComfyUI custom nodes to find which one causes a problem. A state machine driven by the `action` parameter:"},{"name":"install_custom_node","description":"Install, repair, enable/disable and remove ComfyUI custom node packs on this ComfyUI. To FIND a pack in the public registry first, use search_custom_nodes. D..."},{"name":"report_issue","description":"DISABLED \u2014 issue reporting remains off during limited maintenance. This tool files NOTHING and contacts no service. It returns the reporting status, without..."},{"name":"install_comfyui","description":"Install, update and configure the local ComfyUI installation, its sidebar panel, and this MCP server itself. Driven by the `action` parameter:"},{"name":"model_metadata","description":"Curate a model file's embedded .safetensors metadata (Model Explorer). Driven by the `action` parameter:"},{"name":"workspace","description":"Inspect and manage ComfyUI workspaces (local installs). Driven by the `action` parameter:"},{"name":"list_api_nodes","description":"Discover and run hosted partner/API nodes on the connected ComfyUI (e.g. Flux/BFL, Ideogram, Kling, Stability). These call external image/video providers and..."},{"name":"node_pack","description":"Author, edit, test and publish YOUR OWN ComfyUI custom-node pack under the custom_nodes/ directory the running ComfyUI actually scans. LOCAL-ONLY: it acts on..."},{"name":"apply_manifest","description":"Apply a ComfyUI setup manifest from an inline object or .json/.yaml/.yml file. Composes custom-node installs and model downloads, installs pip packages, and..."},{"name":"list_packs","description":"Bundled ComfyUI knowledge \u2014 installer packs, model-family skills, workflow templates \u2014 plus the two workflow-readiness checks. Driven by the `action` parameter:"},{"name":"calculate","description":"Evaluate a batch of math expressions exactly \u2014 no ComfyUI connection needed, so it works even in cloud mode or when ComfyUI is down. A safe, zero-dependency..."},{"name":"train_prepare_dataset","description":"Stage and curate the training DATASETS a LoRA run consumes \u2014 the images and their captions. Datasets are keyed by `name`; the jobs that train on them live in..."},{"name":"train_start","description":"Run and inspect LoRA training JOBS \u2014 launch a run, poll it, stop it, delete it, and read back the settings behind it. Jobs are keyed by `id`; the datasets th..."},{"name":"train_doctor","description":"Preflight and set up the TRAINER ITSELF \u2014 the docker/GPU/venv machinery every training job needs. Touches no dataset and no job. Driven by the `action` param..."},{"name":"apps","description":"Micro-apps on this ComfyUI (panel Apps feature): named workflows packaged for one-click runs. Driven by the `action` parameter:"},{"name":"batch","description":"Run MANY ComfyUI workflows under one durable batch_id. Driven by the `action` parameter:"},{"name":"kitchen","description":"See what comfy-kitchen can do on this GPU, find where a graph is leaving it on the table, and apply the faster path. Driven by `action`:"},{"name":"list_tools","description":"List every comfyui-mcp capability as a token-light catalog: tool names with one-line summaries, grouped by category. Start here. Then use describe_tool to ge..."},{"name":"describe_tool","description":"Get the full description and JSON Schema of one tool from the catalog. Always call this before the first call_tool of a tool you haven't used in this session."},{"name":"call_tool","description":"Execute a tool from the catalog by name. Pass its parameters in `args` (object). The result is exactly what the underlying tool returns."}]
spec:
  image: ghcr.io/rwlove/comfyui-mcp:v0.52.206
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: COMFYUI_MCP_ALLOW_UNAUTH
              value: "1"
            - name: COMFYUI_URL
              value: http://comfyui.ai.svc.cluster.local:8188
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: nodetmp
              mountPath: /home/node/.npm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nodetmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
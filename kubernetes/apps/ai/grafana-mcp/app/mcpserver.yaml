---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name grafana-mcp
spec:
  image: grafana/mcp-grafana:2.1.1
  transport: stdio
  groupRef:
    name: mcp-tools
  args:
    - "-t"
    - "stdio"
    # Filter tools natively via --enabled-tools instead of MCPToolConfig.toolsFilter.
    # ToolHive v0.56.0's tool-filter middleware strips "resultType" when re-encoding
    # tools/list responses, which breaks MCP 2026-07-28 health checks in vmcp.
    # Self-hosted Grafana OSS with Prometheus + Alertmanager only: excludes Grafana Cloud
    # features (incident, oncall, asserts, agento11y, assistant), unused datasources
    # (loki, pyroscope, tempo), and snapshot/plugin/api/config/provisioning/docs/user tools.
    - "--enabled-tools=datasource,prometheus,alerting,dashboard,folder,search,navigation,annotations,rendering"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
  toolConfigRef:
    name: *name
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 110Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 100Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: grafana-mcp
spec:
  # Left empty because ToolHive v0.56.0's tool-filter middleware unmarshals tools/list
  # into a struct with only result.tools, stripping result.resultType ("complete") required
  # by MCP protocol revision 2026-07-28 and causing vmcp health checks to fail with:
  # "backend returned a Legacy-shaped body (no resultType)".
  # Tool filtering is handled natively via --enabled-tools on the MCPServer args above.
  toolsFilter: []
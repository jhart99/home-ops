---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name grafana-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Grafana"
    toolhive.stacklok.dev/registry-url: "http://mcp-grafana-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "Access Grafana dashboards, datasources, Prometheus metrics, alerting rules, annotations, and panel rendering."
    toolhive.stacklok.dev/tools: |
      ["alerting_manage_routing","alerting_routing_write","alerting_rules_read","alerting_rules_write","alerting_silences_read","alerting_silences_write","check_datasources_health","create_annotation","create_datasource","create_folder","delete_annotation","generate_deeplink","get_annotation_tags","get_annotations","get_dashboard_by_uid","get_dashboard_panel_queries","get_dashboard_property","get_dashboard_summary","get_datasource","get_panel_image","list_dashboard_versions","list_datasources","list_prometheus_label_names","list_prometheus_label_values","list_prometheus_metric_metadata","list_prometheus_metric_names","query_prometheus","query_prometheus_histogram","search_dashboards","search_folders","update_annotation","update_dashboard","update_datasource"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"alerting_manage_routing","description":"Manage Grafana alerting routing configuration, including notification policies, contact points and time intervals."},{"name":"alerting_routing_write","description":"Create Grafana-managed contact points for alert notifications using operation 'create_contact_point'."},{"name":"alerting_rules_read","description":"List and inspect Grafana alert rules with filtering capabilities."},{"name":"alerting_rules_write","description":"Create, update, and delete Grafana alert rules."},{"name":"alerting_silences_read","description":"List and inspect Grafana alerting silences. A silence temporarily suppresses notifications for alerts whose labels match a set of matchers."},{"name":"alerting_silences_write","description":"Create, update, and delete Grafana alerting silences. A silence temporarily suppresses notifications for alerts whose labels match a set of matchers, without..."},{"name":"check_datasources_health","description":"Check datasource health. Filter by type or UIDs; omit both to check all."},{"name":"create_annotation","description":"Create a new annotation on a dashboard or panel. Set format to 'graphite' and provide 'what' for Graphite-format annotations."},{"name":"create_datasource","description":"Create a datasource in two steps. Called with only the type, it returns the plugin's field schema and creates nothing. Called with the type, the display name..."},{"name":"create_folder","description":"Create a Grafana folder. Provide a title and optional UID. Returns the created folder."},{"name":"delete_annotation","description":"Permanently delete an annotation by ID. The annotation cannot be recovered afterwards."},{"name":"generate_deeplink","description":"Generate deeplink URLs for Grafana resources. Supports dashboards (requires dashboardUid or provisioningPreview), panels (requires dashboardUid or provisioni..."},{"name":"get_annotation_tags","description":"Returns annotation tags with optional filtering by tag name. Only the provided filters are applied."},{"name":"get_annotations","description":"Fetch Grafana annotations using filters such as dashboard UID, time range and tags."},{"name":"get_dashboard_by_uid","description":"Retrieves the complete dashboard, including panels, variables, and settings, for a specific dashboard identified by its UID. Pass optional version to load a..."},{"name":"get_dashboard_panel_queries","description":"Retrieve panel queries from a Grafana dashboard. Supports all datasource types (Prometheus, Loki, CloudWatch, SQL, etc.) and row-nested panels. Optionally fi..."},{"name":"get_dashboard_property","description":"Get specific parts of a dashboard using JSONPath expressions to minimize context window usage. JSONPath targets the dashboard's native schema. Classic v1 pat..."},{"name":"get_dashboard_summary","description":"Get a compact summary of a dashboard including title, panel count, panel types, variables, and other metadata without the full JSON. Use this for dashboard o..."},{"name":"get_datasource","description":"Retrieves detailed information about a specific datasource by UID or name. Returns the full datasource model, including name, type, URL, access settings, JSO..."},{"name":"get_panel_image","description":"Render a Grafana dashboard panel, full dashboard or Explore view as a PNG image. Returns the image as base64 encoded data. Requires the Grafana Image Rendere..."},{"name":"list_dashboard_versions","description":"List saved versions of a Grafana dashboard. Returns compact metadata: version number, author, timestamp, and save message. A version number can be passed to..."},{"name":"list_datasources","description":"List all configured datasources in Grafana. Use this to discover available datasources and their UIDs. Supports filtering by type and/or name (case-insensiti..."},{"name":"list_prometheus_label_names","description":"List label names in a PromQL-compatible datasource (Prometheus, Thanos, Mimir, Cloud Monitoring, etc.). Allows filtering by series selectors and time range."},{"name":"list_prometheus_label_values","description":"Gets the values for a specific label name in a PromQL-compatible datasource (Prometheus, Thanos, Mimir, Cloud Monitoring, etc.). Allows filtering by series s..."},{"name":"list_prometheus_metric_metadata","description":"List Prometheus metric metadata. Returns metadata about metrics currently scraped from targets. Note: This endpoint is experimental."},{"name":"list_prometheus_metric_names","description":"Lists metric names in a PromQL-compatible datasource (Prometheus, Thanos, Mimir, Cloud Monitoring, etc.). Filters metric names using the provided regex. Supp..."},{"name":"query_prometheus","description":"Query a PromQL-compatible datasource (Prometheus, Thanos, Mimir, Cloud Monitoring, etc.) using a PromQL expression. Supports instant queries (single point) a..."},{"name":"query_prometheus_histogram","description":"Query Prometheus histogram percentiles from classic histogram '_bucket' series."},{"name":"search_dashboards","description":"Search Grafana dashboards by query and/or folderUid, tag, and starred. Returns matching dashboards with title, UID, folder, tags, and URL."},{"name":"search_folders","description":"Search for Grafana folders by a query string. Returns matching folders with details like title, UID, and URL."},{"name":"update_annotation","description":"Updates the provided properties of an annotation by ID. Only fields included in the request are modified; omitted fields are left unchanged."},{"name":"update_dashboard","description":"Create or update a dashboard. Returns the saved dashboard UID and dashboard link in the 'url' field, using the instance public URL when available. Two modes:..."},{"name":"update_datasource","description":"Update non-secret datasource fields by UID in two steps. Called with only the uid, it returns the datasource's field schema and changes nothing. Called with..."}]
spec:
  image: grafana/mcp-grafana:2.1.1
  transport: stdio
  groupRef:
    name: mcp-tools
  args:
    - "-t"
    - "stdio"
    # Filter tools natively via --enabled-tools instead of MCPToolConfig.toolsFilter.
    # ToolHive v0.56.0's tool-filter middleware strips "resultType" when re-encoding
    # tools/list responses, which breaks MCP 2026-07-28 health checks in vmcp.
    # Self-hosted Grafana OSS with Prometheus + Alertmanager only: excludes Grafana Cloud
    # features (incident, oncall, asserts, agento11y, assistant), unused datasources
    # (loki, pyroscope, tempo), and snapshot/plugin/api/config/provisioning/docs/user tools.
    - "--enabled-tools=datasource,prometheus,alerting,dashboard,folder,search,navigation,annotations,rendering"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
  toolConfigRef:
    name: *name
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 110Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 100Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: grafana-mcp
spec:
  # Left empty because ToolHive v0.56.0's tool-filter middleware unmarshals tools/list
  # into a struct with only result.tools, stripping result.resultType ("complete") required
  # by MCP protocol revision 2026-07-28 and causing vmcp health checks to fail with:
  # "backend returned a Legacy-shaped body (no resultType)".
  # Tool filtering is handled natively via --enabled-tools on the MCPServer args above.
  toolsFilter: []
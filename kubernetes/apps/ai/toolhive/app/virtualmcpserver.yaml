---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/mcpoidcconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: vmcp-oidc
  namespace: toolhive-system
spec:
  type: inline
  inline:
    issuer: https://auth.rnatr.com
    clientId: PeYLk6eNz5on46QEh81SfL0QA6irMCBohRJiDaFa
    clientSecretRef:
      name: oidc-client-secret
      key: clientSecret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: vmcp-oauth
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "MCP Gateway (OAuth)"
    toolhive.stacklok.dev/registry-url: "https://mcp.rnatr.com/mcp"
    toolhive.stacklok.dev/registry-description: "External OIDC-authenticated Virtual MCP Server gateway aggregating all in-cluster MCP tools with semantic tool optimization."
    toolhive.stacklok.dev/tools: |
      ["find_tool","call_tool"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"find_tool","description":"Search and discover available MCP tools across all aggregated backend servers using semantic and keyword matching."},{"name":"call_tool","description":"Execute a discovered MCP tool by name with its required parameters."}]
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      embeddingModel: qwen3-embedding
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: vmcp-oidc
      audience: https://mcp.rnatr.com/mcp
      resourceUrl: https://mcp.rnatr.com/mcp
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  telemetryConfigRef:
    name: prometheus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "MCP Gateway (Internal)"
    toolhive.stacklok.dev/registry-url: "http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp"
    toolhive.stacklok.dev/registry-description: "Internal Virtual MCP Server gateway aggregating all in-cluster MCP tools with semantic tool optimization."
    toolhive.stacklok.dev/tools: |
      ["find_tool","call_tool"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"find_tool","description":"Search and discover available MCP tools across all aggregated backend servers using semantic and keyword matching."},{"name":"call_tool","description":"Execute a discovered MCP tool by name with its required parameters."}]
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      embeddingModel: qwen3-embedding
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              cpu: 1000m 
              memory: 2Gi
  telemetryConfigRef:
    name: prometheus

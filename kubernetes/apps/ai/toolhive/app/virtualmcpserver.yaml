---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: vmcp-oidc
  namespace: toolhive-system
spec:
  type: inline
  inline:
    issuer: https://auth.rnatr.com
    clientId: PeYLk6eNz5on46QEh81SfL0QA6irMCBohRJiDaFa
    clientSecretRef:
      name: oidc-client-secret
      key: clientSecret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: VirtualMCPServer
metadata:
  name: vmcp-oauth
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      embeddingModel: qwen3-embedding
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: vmcp-oidc
      audience: https://mcp.rnatr.com/mcp
      resourceUrl: https://mcp.rnatr.com/mcp
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  telemetryConfigRef:
    name: prometheus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/toolhive.stacklok.dev/virtualmcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    optimizer:
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      embeddingModel: qwen3-embedding
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  telemetryConfigRef:
    name: prometheus
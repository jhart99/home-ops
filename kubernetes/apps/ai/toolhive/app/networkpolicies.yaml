# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
# endpointSelector covers both VirtualMCPServers (vmcp-oauth, mcp-gateway-internal).
---
# Gateways call LiteLLM for embeddings (embeddingService -> litellm:4000), do OIDC
# discovery against auth.rnatr.com, talk to kube-apiserver, and proxy to the per-server MCP pods (80/8080).
# TODO(enforce phase): replace the cluster rule with the concrete MCP endpoints and
# world:443 with the OIDC issuer FQDN observed in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: toolhive-allow-egress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
  egress:
    # In-cluster Envoy Gateway (auth.rnatr.com Authentik OIDC and same-node return traffic)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            toolhive: "true"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              endPort: 8081
              protocol: TCP
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
---
# Ingress: envoy-internal gateway serves mcp-internal.${SECRET_DOMAIN} (4483), kubelet
# probes /health (4483), in-cluster MCP clients (e.g. hermes) call the gateways.
# TODO(enforce phase): scope the cluster rule to the real MCP clients seen in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: toolhive-allow-ingress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
  ingress:
    # Response traffic from in-cluster MCP proxies (ephemeral return ports)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive: "true"
    # Ingress to virtualmcpserver on port 4483
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    # kubelet liveness/readiness probes (/health) arrive from the node
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
---
# Shared policy for all ToolHive MCP servers (both mcpserver proxy Deployments and
# backend MCP StatefulSets, which all carry `toolhive: "true"`):
#   - Ingress: kubelet health probes from host/remote-node, MCP traffic from
#     virtualmcpserver and hermes, and proxy->backend forwarding on MCP ports
#     (80, 3000, 8000, 8080, 8081).
#   - Egress: proxy->backend forwarding between ToolHive pods on MCP ports.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: toolhive-mcp-allow-common
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive: "true"
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              endPort: 8081
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: virtualmcpserver
        - matchLabels:
            app.kubernetes.io/name: hermes
        - matchLabels:
            toolhive: "true"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              endPort: 8081
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            toolhive: "true"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              endPort: 8081
              protocol: TCP

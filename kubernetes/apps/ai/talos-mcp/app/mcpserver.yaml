---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: talos-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Talos Linux"
    toolhive.stacklok.dev/registry-url: "http://mcp-talos-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "Inspect and manage Talos Linux nodes, system services, dmesg, kernel logs, network interfaces, and storage."
    toolhive.stacklok.dev/tools: |
      ["talos_container_stats","talos_containers","talos_disk_stats","talos_disk_usage","talos_disks","talos_dmesg","talos_etcd_alarms","talos_etcd_members","talos_etcd_status","talos_get","talos_health","talos_image_list","talos_kubeconfig","talos_list","talos_logs_containers","talos_memory","talos_mounts","talos_netstat","talos_processes","talos_read","talos_service_list","talos_service_logs","talos_time","talos_version"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"talos_container_stats","description":"Container resource stats (equivalent to `talosctl stats`)."},{"name":"talos_containers","description":"List containers running on the node (equivalent to `talosctl containers`)."},{"name":"talos_disk_stats","description":"Per-device block I/O counters from /proc/diskstats (equivalent to `talosctl diskstats`)."},{"name":"talos_disk_usage","description":"Report disk usage for one or more paths (equivalent to `talosctl usage`)."},{"name":"talos_disks","description":"List block devices on one or more nodes (equivalent to `talosctl disks`)."},{"name":"talos_dmesg","description":"Stream kernel ring buffer; collects up to 1000 lines (equivalent to `talosctl dmesg`)."},{"name":"talos_etcd_alarms","description":"List active etcd alarms (equivalent to `talosctl etcd alarm list`). An empty list means etcd is healthy."},{"name":"talos_etcd_members","description":"List etcd cluster members (equivalent to `talosctl etcd members`)."},{"name":"talos_etcd_status","description":"Show etcd status (leader, raft index, db size \u2014 equivalent to `talosctl etcd status`)."},{"name":"talos_get","description":"Read COSI resources from a Talos node (equivalent to `talosctl get`). Single tool covers all resource types \u2014 try `members`, `nodeips`, `routes`, `addresses`..."},{"name":"talos_health","description":"Run a Talos cluster health check (equivalent to `talosctl health`). Returns the streamed progress messages."},{"name":"talos_image_list","description":"List cached container images on a node (equivalent to `talosctl image list`)."},{"name":"talos_kubeconfig","description":"Download the admin kubeconfig from a control-plane node (equivalent to `talosctl kubeconfig -`)."},{"name":"talos_list","description":"List the contents of a directory on a node (equivalent to `talosctl list`). Capped at 2000 entries."},{"name":"talos_logs_containers","description":"List the log containers/services available for `talos_service_logs` on a node."},{"name":"talos_memory","description":"Return /proc/meminfo for one or more nodes (equivalent to `talosctl memory`)."},{"name":"talos_mounts","description":"List mounts on one or more nodes (equivalent to `talosctl mounts`)."},{"name":"talos_netstat","description":"Show network connections (equivalent to `talosctl netstat`)."},{"name":"talos_processes","description":"List running processes on one or more nodes (equivalent to `talosctl processes`)."},{"name":"talos_read","description":"Read a file from a node (equivalent to `talosctl read`). Capped at 1 MiB."},{"name":"talos_service_list","description":"List Talos system services and their state (equivalent to `talosctl service`)."},{"name":"talos_service_logs","description":"Tail logs for a Talos service or container (equivalent to `talosctl logs`)."},{"name":"talos_time","description":"Return the current Talos server time (equivalent to `talosctl time`)."},{"name":"talos_version","description":"Return Talos version info from one or more nodes (equivalent to `talosctl version`)."}]
spec:
  image: registry.erwanleboucher.dev/eleboucher/talos-mcp:0.0.2
  transport: streamable-http
  mcpPort: 8080
  groupRef:
    name: mcp-tools
  permissionProfile:
    type: builtin
    name: network
  env:
    - name: TALOS_MCP_TRANSPORT
      value: http
    - name: TALOS_MCP_HTTP_ADDR
      value: ":8080"
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: talosconfig
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
      volumes:
        - name: talosconfig
          secret:
            secretName: talos-mcp-talosconfig
            defaultMode: 0400
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: talos
spec:
  toolsFilter: []
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny.
# Allow SQL clients (LiteLLM) to reach postgres on 5432
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-db-allow-client-ingress
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: litellm-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Allow intra-cluster postgres traffic between instances (streaming replication 5432)
# and instance-manager communication (8000)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-db-allow-instance-traffic
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: litellm-db
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            cnpg.io/cluster: litellm-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            cnpg.io/cluster: litellm-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # CNPG operator reconciles and manages instances over port 8000
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# Allow barman-cloud instance sidecar to archive WAL/backups to S3
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-db-allow-backup-egress
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: litellm-db
  egress:
    - toFQDNs:
        - matchName: s3.rnatr.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Allow Prometheus to scrape postgres_exporter sidecar (port 9187)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-db-allow-prometheus-scrape
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: litellm-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
# Allow kubelet health probes from node
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-db-allow-kubelet-probes
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: litellm-db
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP

# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: comfyui-allow-dns
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: comfyui
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Custom nodes and checkpoint fetches go to the ComfyUI registry/GitHub over HTTPS;
# models are also served from the NFS share (/pool/share/fileshare/models).
# TODO(enforce phase): pin toFQDNs for the registries; add explicit node CIDRs for NFS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: comfyui-allow-egress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: comfyui
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
    - toEntities:
        - host
        - remote-node
---
# Ingress: envoy-internal gateway serves the UI route, comfyui-mcp drives the API,
# kubelet tcp probes hit 8188.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: comfyui-allow-ingress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: comfyui
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "8188"
              protocol: TCP
    # kubelet liveness/readiness probes (tcp 8188) arrive from the node
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8188"
              protocol: TCP
    # TODO(enforce phase): scope to comfyui-mcp (toolhive-name: comfyui-mcp) once seen in Hubble.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8188"
              protocol: TCP

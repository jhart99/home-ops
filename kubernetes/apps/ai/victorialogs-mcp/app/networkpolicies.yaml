# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# Queries VictoriaLogs in observability (VICTORIA_LOGS_URL ->
# victoria-logs-server.observability.svc:9428). ToolHive proxy connects to kube-apiserver
# and forwards to backend MCP pod on 8081.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victorialogs-mcp-allow-egress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      toolhive-name: victorialogs-mcp
  egress:
    # Same-node return traffic and routes to Envoy Gateway
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
# envoy-internal gateway routes victorialogs-mcp.${SECRET_DOMAIN} from network namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victorialogs-mcp-allow-ingress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      toolhive-name: victorialogs-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

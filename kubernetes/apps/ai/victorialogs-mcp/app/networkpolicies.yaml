# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victorialogs-mcp-allow-dns
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: victorialogs-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Queries VictoriaLogs in observability (VICTORIA_LOGS_URL ->
# victoria-logs-server.observability.svc:9428). ToolHive proxy connects to kube-apiserver
# and forwards to backend MCP pod on 8081.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victorialogs-mcp-allow-egress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: victorialogs-mcp
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            toolhive-name: victorialogs-mcp
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
# kubelet /health probes (8080 on proxy, 8081 on server) from the node; toolhive gateways call the server.
# Also envoy-internal gateway routes victorialogs-mcp.${SECRET_DOMAIN} from network namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victorialogs-mcp-allow-ingress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: victorialogs-mcp
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: virtualmcpserver
        - matchLabels:
            app.kubernetes.io/name: hermes
        - matchLabels:
            toolhive-name: victorialogs-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP

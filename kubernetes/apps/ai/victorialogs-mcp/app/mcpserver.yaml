---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name victorialogs-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Victorialogs"
    toolhive.stacklok.dev/registry-url: "http://mcp-victorialogs-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "This provides access to your VictoriaLogs instance and seamless integration with VictoriaLogs APIs and documentation. It can give you a comprehensive interface for logs, observability, and debugging tasks related to your VictoriaLogs instances, enable advanced automation and interaction capabilities for engineers and tools."
    toolhive.stacklok.dev/tools: |
      ["documentation","facets","field_names","field_values","flags","hits","query","stats_query","stats_query_range","stream_field_names","stream_field_values","stream_ids","streams"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"documentation","description":"Search documentation resources for the given search query, returning the URIs of the resources that match the search criteria sorted by relevance. This tool..."},{"name":"facets","description":"The most frequent values per each log field seen in the logs returned by the given <query> on the given [<start> ... <end>] time range. This tool uses `/sele..."},{"name":"field_names","description":"Get field names from results of the given <query> on the given [<start> ... <end>] time range. The response also contains the number of log results per every..."},{"name":"field_values","description":"Get unique values for the given <fieldName> field from results of the given <query> on the given [<start> ... <end>] time range. The response also contains t..."},{"name":"flags","description":"List of non-default flags (parameters) of the VictoriaLogs instance. This tools uses `/flags` endpoint of VictoriaLogs API."},{"name":"hits","description":"The number of matching log entries for the given <query> on the given [<start> ... <end>] time range grouped by <step> buckets. The returned results are sort..."},{"name":"query","description":"Executes LogsQL query expression to search log entries. This tool uses `/select/logsql/query` endpoint of VictoriaLogs API."},{"name":"stats_query","description":"Log stats for the given query at the given timestamp (time) in the format compatible with Prometheus querying API. This tool uses `/select/logsql/stats_query..."},{"name":"stats_query_range","description":"Log stats for the given query on the given [start ... end] time range with the given step interval. The stats is returned in the format compatible with Prome..."},{"name":"stream_field_names","description":"Get log stream field names from results of the given <query> on the given [<start> ... <end>] time range. The response also contains the number of log result..."},{"name":"stream_field_values","description":"Get unique values for the given <fieldName> field from results of the given <query> on the given [<start> ... <end>] time range. The response also contains t..."},{"name":"stream_ids","description":"Get _stream_id values for the log streams from results of the given <query> on the given [<start> ... <end>] time range. The response also contains the numbe..."},{"name":"streams","description":"Get log streams from results of the given <query> on the given [<start> ... <end>] time range. The response also contains the number of log results per every..."}]
spec:
  image: ghcr.io/victoriametrics/mcp-victorialogs:v1.9.0
  transport: streamable-http
  mcpPort: 8081
  groupRef:
    name: mcp-tools
  permissionProfile:
    type: builtin
    name: network
  env:
    - name: MCP_SERVER_MODE
      value: http
    - name: MCP_LISTEN_ADDR
      value: :8081
    - name: MCP_LOG_FORMAT
      value: json
    - name: MCP_LOG_LEVEL
      value: info
    - name: VL_INSTANCE_ENTRYPOINT
      value: http://victoria-logs-server.observability.svc.cluster.local:9428
  toolConfigRef:
    name: *name
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: victorialogs-mcp
spec:
  toolsFilter: []
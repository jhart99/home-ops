---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: &ns ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  # Apply to all pods in the namespace
  endpointSelector:
    matchLabels: {}
  ingress:
  - fromEndpoints:
    # Cilium automatically attaches the namespace as a label to all endpoints
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": *ns
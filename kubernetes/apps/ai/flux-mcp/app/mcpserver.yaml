---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name flux-operator-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Flux Operator"
    toolhive.stacklok.dev/registry-url: "http://mcp-flux-operator-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "Inspect, troubleshoot, and manage Kubernetes workloads and Flux CD GitOps pipelines."
    toolhive.stacklok.dev/tools: |
      ["apply_kubernetes_manifest","delete_kubernetes_resource","diff_kubernetes_manifest","get_flux_instance","get_kubernetes_api_versions","get_kubernetes_events","get_kubernetes_logs","get_kubernetes_metrics","get_kubernetes_resources","install_flux_instance","patch_kubernetes_resource","read_flux_doc","reconcile_flux_resource","resume_flux_reconciliation","search_flux_docs","suspend_flux_reconciliation","trace_kubernetes_resource"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"apply_kubernetes_manifest","description":"Applies a Kubernetes YAML manifest on the cluster."},{"name":"delete_kubernetes_resource","description":"Deletes a Kubernetes resource from the cluster."},{"name":"diff_kubernetes_manifest","description":"Diffs a Kubernetes YAML manifest against the cluster using a server-side apply dry-run."},{"name":"get_flux_instance","description":"Retrieves the Flux installation report with controllers, CRDs and their reconciliation status."},{"name":"get_kubernetes_api_versions","description":"Retrieves the CRDs registered on the cluster and their preferred apiVersion for each kind."},{"name":"get_kubernetes_events","description":"Retrieves Kubernetes events, optionally filtered by namespace, involved object, type, time window and regex."},{"name":"get_kubernetes_logs","description":"Retrieves logs from a Kubernetes pod."},{"name":"get_kubernetes_metrics","description":"Retrieves CPU and memory usage of pods."},{"name":"get_kubernetes_resources","description":"Retrieves Kubernetes resources from the cluster."},{"name":"install_flux_instance","description":"Installs Flux Operator and a Flux instance on the cluster from a manifest URL."},{"name":"patch_kubernetes_resource","description":"Patches a Kubernetes resource on the cluster with a merge, JSON or strategic merge patch."},{"name":"read_flux_doc","description":"Reads a Flux Operator documentation page as markdown. Use the path from search_flux_docs results. Long pages should be read in slices: pass heading to jump t..."},{"name":"reconcile_flux_resource","description":"Reconciles a Flux resource by triggering an on-demand reconciliation, optionally reconciling its source first."},{"name":"resume_flux_reconciliation","description":"Resumes reconciliation for a Flux resource."},{"name":"search_flux_docs","description":"Searches the Flux Operator and Flux CRD documentation, returning the most relevant sections with their path and line range. Query with 2-5 keywords naming th..."},{"name":"suspend_flux_reconciliation","description":"Suspends reconciliation for a Flux resource."},{"name":"trace_kubernetes_resource","description":"Traces a Kubernetes resource up the GitOps delivery pipeline to the Flux objects managing it and their source."}]
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.61.0
  transport: stdio
  groupRef:
    name: mcp-tools
  args:
    - serve
  env:
    - name: KUBECONFIG
      value: /kubeconfig/kubeconfig
  toolConfigRef:
    name: *name
  podTemplateSpec:
    spec:
      volumes:
        - name: kubeconfig
          secret:
            secretName: toolhive-flux
            items:
              - key: kubeconfig
                path: kubeconfig
      containers:
        - name: mcp
          volumeMounts:
            - name: kubeconfig
              mountPath: /kubeconfig
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 1
              memory: 256Mi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 200Mi
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: flux-operator-mcp
spec:
  toolsFilter: []
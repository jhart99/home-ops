    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"inspect_analysis_settings","description":"Inspect REA's editable runtime admission sizes, deadlines and worker heaps, their bounds, launch values and application points. No active target is required...."},{"name":"update_analysis_settings","description":"When REA names an adjustable limit, atomically set or reset its runtime default, then retry once work and cleanup have settled. No inspection call is require..."},{"name":"inspect_desktop_application","description":"Inspect a local desktop application directory using bounded listings, file headers and selected metadata. Returns .NET, Unity Mono/IL2CPP, Unreal, Godot, Gam..."},{"name":"inspect_model_artifact","description":"Inspect local GGUF v2/v3 or safetensors declarations by content, without loading models or executing code. Default hash header reads only the header: full-fi..."},{"name":"inspect_gpu_code_objects","description":"Inspect static CUDA/HIP GPU code objects in local ELF/PE hosts, CUDA fatbins, CUBIN, PTX and Clang HIP bundles (CUDA LZ4/Zstd and CCOB v1/v2/v3 zlib/Zstd). D..."},{"name":"annotate_native_function","description":"Atomically update one function name and/or entry comments, read them back, and return a refreshed complete function dossier. Ghidra changes its ephemeral ses..."},{"name":"inspect_native_load_image","description":"Verify the provider's loaded DOS MZ or explicitly selected COM image against its immutable target snapshot: complete original/modified source-byte digests, h..."},{"name":"inspect_native_data_type","description":"Inspect one recovered type by exact database category path or defined typed data address. Returns observed size, alignment, packing, fields, bitfields, enum..."},{"name":"inspect_native_instruction","description":"Inspect one exact code or data address: decoded bytes, mnemonic, ordered operand tokens, flow, outgoing instruction references and typed incoming references..."},{"name":"resolve_native_call_targets","description":"Resolve one explicit static call site using typed provider call references. Preserves ambiguous targets as candidates and unresolved computed calls as unknow..."},{"name":"address_name","description":"Resolve the primary analyzed name at a code or data address. Headless providers require an explicit address; GUI providers may default to their current curso..."},{"name":"comment","description":"Read the regular analysis comment at an address, defaulting to the current cursor. This is read-only and returns null when no comment exists; use set_comment..."},{"name":"current_address","description":"Return Hopper's current cursor address for the selected document. Use only for interactive navigation state; prefer explicit addresses in reproducible invest..."},{"name":"current_procedure","description":"Return the analyzed procedure containing Hopper's current cursor. This uses GUI cursor state and is not a procedure-name lookup."},{"name":"current_document","description":"Return the document currently selected by REA's Hopper bridge."},{"name":"goto_address","description":"Move Hopper's GUI cursor to a mapped address and return the observed cursor address. Interior coordinates snap to the containing analyzed object's start. Unm..."},{"name":"inline_comment","description":"Read the inline instruction comment at an address, defaulting to the current cursor. Returns null when absent; use set_inline_comment to write one."},{"name":"list_bookmarks","description":"List every bookmark in the selected Hopper document as address and name pairs; unnamed bookmarks retain a null name. Use bookmarks as analyst-authored naviga..."},{"name":"list_documents","description":"List provider program or document identities. Hopper may expose several documents; a Ghidra headless session contains exactly its one imported Program."},{"name":"list_names","description":"List every analyzed memory and external symbol as address/value pairs. Provider metadata distinguishes Ghidra primary, dynamic, external, type, and source fa..."},{"name":"list_procedures","description":"List every analyzed procedure as address/value pairs after provider analysis. Ghidra metadata distinguishes thunks and external functions; use returned addre..."},{"name":"list_segments","description":"List segments or memory blocks using exclusive end addresses. Ghidra reports block permissions, address space, image base, initialization, and overlay facts;..."},{"name":"list_strings","description":"List every provider-reported string object or candidate, or filter to one address, as address/value pairs with encoding, terminator status, and byte length w..."},{"name":"next_address","description":"Return the next analyzed object address after an explicit address or current cursor. This is a navigation primitive, not instruction-flow or CFG analysis."},{"name":"prev_address","description":"Return the previous analyzed object start before an explicit address or current cursor. This is a navigation primitive and may fail at document boundaries; d..."},{"name":"procedure_address","description":"Resolve an unambiguous procedure symbol name or provider-normalized address to its canonical entry address. External address spaces remain explicit."},{"name":"procedure_assembly","description":"Return assembly for one analyzed procedure identified by symbol or hexadecimal address. Use when pseudocode loses calling-convention or instruction-level det..."},{"name":"procedure_callees","description":"Return the provider's resolved direct callees for one procedure identified by symbol or address. Unresolved indirect calls may be absent; use analyze_functio..."},{"name":"procedure_callers","description":"Return the provider's resolved direct callers for one procedure identified by symbol or address. Results reflect completed static analysis and may omit unres..."},{"name":"procedure_info","description":"Return provider metadata for one procedure identified by symbol or address: entrypoint, signature, locals, size, block count, and complete inclusive body ran..."},{"name":"read_function_instructions","description":"Return every raw instruction for one analyzed procedure. Instruction text and body extent are provider-specific. Ghidra terminal-call assumptions that may cu..."},{"name":"search_bytes","description":"Find masked byte signatures in initialized analyzed memory. Hex byte pairs and ?? wildcards are supported; an optional equal-length hex mask selects bits. Bo..."},{"name":"read_bytes","description":"Read analyzed bytes from one provider-normalized virtual address. The hexadecimal payload reports the exact returned length; incomplete reads remain explicit..."},{"name":"address_to_file_offset","description":"Map one provider-normalized virtual address to its original nonnegative file offset. Hopper verifies the original bytes against the selected executable diges..."},{"name":"procedure_references","description":"Return every raw incoming or outgoing reference edge for one procedure. Endpoint procedures are resolved only from provider containment. Ghidra preserves det..."},{"name":"procedure_pseudo_code","description":"Decompile one analyzed procedure by symbol name or provider-normalized address. Ghidra also accepts file-offset:0x... selectors and falls back to a unique so..."},{"name":"resolve_containing_procedure","description":"Resolve an arbitrary address, including an interior instruction or exact external entry, to its provider-analyzed containing procedure. A negative result dis..."},{"name":"search_procedures","description":"Search every analyzed procedure name using literal matching by default or regex when requested. Results are deterministic and complete. Hopper regex mode use..."},{"name":"search_strings","description":"Search every provider-reported string object or candidate using literal matching by default or regex when requested. Results are deterministic and complete o..."},{"name":"set_address_name","description":"Assign an analyst name to one mapped hexadecimal address and report whether the native edit succeeded and exact readback matched. Hopper rejects symbol names..."},{"name":"set_addresses_names","description":"Assign analyst names to multiple mapped addresses in one call and return per-address edit/readback success booleans. Hopper validates mapped destinations, na..."},{"name":"set_bookmark","description":"Create or update a bookmark at a mapped hexadecimal address and report readback success. Omit name to preserve an existing name or create an unnamed bookmark..."},{"name":"set_comment","description":"Write a regular analysis comment at a hexadecimal address and return whether readback matched. An empty comment clears it. This mutates the Hopper document;..."},{"name":"set_inline_comment","description":"Write an inline instruction comment at a hexadecimal address and return whether readback matched. An empty comment clears it; Hopper may flatten newlines, pr..."},{"name":"unset_bookmark","description":"Remove the bookmark at a mapped hexadecimal address and return whether it is absent. Hopper also permits removing an existing legacy bookmark outside mapped..."},{"name":"xrefs","description":"Return analyzed references to a code or data address. Hopper may default to its current cursor; headless providers such as Ghidra require an explicit address..."},{"name":"trace_native_values","description":"Trace a bounded static dependency graph from one explicit native procedure. Includes high-p-code def-use, constants, operators, memory and branch operations,..."},{"name":"inspect_native_dispatch_metadata","description":"Inspect the bound provider's name inventory for Objective-C class/method symbols and Swift mangled symbols, returning at most max_records decoded names. Opti..."},{"name":"get_objc_classes","description":"Discover Objective-C class labels, optionally filtering by literal substring. Rows are coalesced only when exact selected-image pointer-fixup evidence proves..."},{"name":"get_objc_protocols","description":"Discover and deduplicate Objective-C and Swift protocol labels."},{"name":"batch_decompile","description":"Decompile each explicit procedure symbol or address, with one provider read active per batch. Preserves each input selector in address and reports the observ..."},{"name":"decompile_all","description":"Write provider pseudocode for every analyzed function, or a filtered subset, into a caller-selected directory and return only a manifest. Each file records t..."},{"name":"get_call_graph","description":"Resolve one symbol or address to its canonical procedure entry, then traverse the bound provider's caller or callee relationships until the reachable graph i..."},{"name":"analyze_swift_types","description":"Categorize analyzed Swift procedure names using their manglings or same-address Swift symbol aliases. Decodes legacy and literal modern nominal contexts into..."},{"name":"find_xrefs_to_name","description":"Resolve an exact name against the bound provider's name inventory and return a resolved or unresolved result. Unresolved names use the stable name_not_found..."},{"name":"binary_overview","description":"Return the bound document and exhaustive procedure/string counts, plus every segment and segment_count when the provider supports segment enumeration. If seg..."},{"name":"analyze_function","description":"Build a dossier for one native function identified by symbol or provider-returned address. Returns identity with complete inclusive analyzed body ranges or e..."},{"name":"inspect_native_api","description":"Analyze a native API boundary in one function identified by symbol or provider-returned address. Returns confidence, evidence, jump-table dispatch/data/case..."},{"name":"trace_feature","description":"Trace the complete literal query, preserving spaces, through every matching string and procedure, their xrefs, and truthful containing-procedure resolution...."},{"name":"trace_call_path","description":"Resolve start and optional goal symbols or addresses to canonical procedure entries, then trace direct callers or callees until the graph is exhausted or the..."},{"name":"trace_native_ui_action","description":"Trace one unique compiled UI action, object ID, native symbol or exact function address through authored connections, encoded or symbolized Objective-C handl..."},{"name":"observe_native_ui","description":"Observe an already-running native app by PID and window ID, bound to the active Mach-O target. Captures a bounded accessibility tree and selected-window scre..."},{"name":"capture_native_ui_scenario","description":"Run selected-element press, increment/decrement scroll, AXValue text entry and bounded wait steps in one exact native app window. Returns ordered before/afte..."},{"name":"observe_native_calls","description":"Launch the active Mach-O as an owned process under LLDB and record each entry into caller-selected functions or Objective-C methods: thread, module, symbol,..."},{"name":"inspect_macho","description":"Inspect Mach-O slices, load commands, imports, exports, dependencies, build metadata, segments, sections, permissions, and exact command provenance without l..."},{"name":"inspect_signature","description":"Inspect the selected Mach-O architecture's code-signing identity, hashes, authorities, designated requirement, entitlements and hardened-runtime state from a..."},{"name":"inspect_plist","description":"Requires an open binary or bundle-resource session; use open_binary or open_bundle_resources first. Parse its Info.plist by default, or select a local plist..."},{"name":"list_architectures","description":"List thin or universal Mach-O slices with offsets, sizes, alignment, explicit coverage, and native-tool provenance. native_command_timeout_ms is the lipo wal..."},{"name":"demangle_swift","description":"Demangle an ordered list of single-line Swift symbols without requiring Hopper. Each input returns demangled, unchanged, or invalid status. An exact undersco..."},{"name":"inspect_artifact","description":"Inspect an active archive or application package, including Node.js SEA carriers, in one call. By default returns the complete content-addressed artifact gra..."},{"name":"extract_artifact","description":"Extract regular files (including Node.js SEA scripts and assets) exposed by a supported active archive reader into a fresh temporary directory chosen by REA...."},{"name":"decode_interface_builder","description":"Decode compiled storyboard and nib archives inside the active Apple app bundle, including keyed property lists and NIBArchive object tables, into a bounded o..."},{"name":"inspect_keyed_archive","description":"Inspect one Foundation NSKeyedArchiver plist in the active app bundle as original object-table nodes, class descriptors, named roots, and UID edges. Preserve..."},{"name":"inspect_asset_catalog","description":"Inspect compiled Assets.car metadata in an active Apple app bundle. Returns stable paginated catalog and rendition records with raw assetutil metadata and ca..."},{"name":"trace_dylib_resolution","description":"Trace how dyld would resolve each Mach-O dylib load for the active Mach-O, or for every executable in the active .app bundle (the main app, XPC services, ext..."},{"name":"inspect_managed_artifact","description":"Inspect an explicit PE/CLI path, or the selected managed target, without loading or executing target code. Omitted or complete detail returns complete metada..."},{"name":"inspect_managed_members","description":"Inspect PE/CLI metadata members, signatures, raw CIL hashes, decoded-instruction-tuple hashes, separately reported exception regions, call edges, field-acces..."},{"name":"inspect_managed_native_boundaries","description":"Inspect PE/CLI ModuleRef, ImplMap/PInvoke declarations, CLI native-header indicators, and non-IL method implementation flags without loading or executing tar..."},{"name":"compare_managed_members","description":"Compare two authenticated inspect_managed_members Evidence records using unique-only tiers: exact declared type, name, and CIL/signature; exact declared type..."},{"name":"verify_managed_native_boundaries","description":"Verify managed P/Invoke/native-boundary declarations against authenticated native export or function Evidence without executing managed code or translating m..."},{"name":"import_managed_reconstruction","description":"Import decompiler-produced managed reconstruction against authenticated inspect_managed_members Evidence. The workflow locks each method to artifact SHA-256,..."},{"name":"project_managed_application_graph","description":"Project authenticated managed artifact, member, and native-boundary Evidence into the provider-neutral application graph without executing managed code, load..."},{"name":"inspect_with_objdump","description":"Run caller-selected GNU objdump inspection against a local artifact, or request operation=architectures without a path to list BFD targets advertised by the..."},{"name":"execute_rizin_command","description":"Execute one caller-selected Rizin command against a local artifact using the Rizin CLI profile that suppresses user settings and scripts while retaining plug..."},{"name":"list_frida_devices","description":"List Frida devices currently available to this host, optionally connecting to the caller-selected remote Frida endpoint. Remote authentication options are us..."},{"name":"list_frida_processes","description":"List processes observed on a selected Frida device or caller-supplied remote endpoint. A remote connection is closed after discovery; authentication values a..."},{"name":"start_frida_session","description":"Attach Frida to one selected process or spawn one selected target. Spawned targets remain paused until resume_frida_session, allowing scripts to load before..."},{"name":"load_frida_script","description":"Load caller-supplied JavaScript into a Frida session. Scripts can read or change target memory and behavior and can access the target process's capabilities...."},{"name":"resume_frida_session","description":"Resume the process created by a paused Frida spawn session. Attached processes are already running and cannot be resumed through this operation."},{"name":"unload_frida_script","description":"Unload one caller-selected Frida script from a live session. This removes that script's instrumentation from the target."},{"name":"frida_session_status","description":"Read observed Frida session state on each call. Default detail=complete returns queued script messages and capture truncation. detail=summary retains the com..."},{"name":"close_frida_session","description":"Unload session scripts and attempt to detach REA's Frida session. Then resume a still-paused spawned process if script cleanup or session detach confirms ins..."},{"name":"instrument_with_frida","description":"Run one caller-authored Frida script against an explicitly selected process and detach when the observation window ends. The CLI and MCP share this ephemeral..."},{"name":"list_cutter_sessions","description":"List live REA bridge sessions hosted by upstream Cutter instances, including observed document identity and bridge-directory security status. Discovery admit..."},{"name":"cutter_command","description":"Run one arbitrary Rizin command in a selected live Cutter session. Commands may edit and persist analysis state or execute plugin-provided effects; completio..."},{"name":"start_gdb_session","description":"Start a BYO GDB process in MI3 mode when available, suppress startup files, and disable auto-loading. Persistent GDB sessions are available only on Linux, wh..."},{"name":"gdb_console","description":"Run one unrestricted GDB CLI command through MI interpreter-exec console and return raw MI, console, target, and log records inline with Evidence. Default de..."},{"name":"gdb_session_status","description":"Return the observed lifecycle state and bounded recent MI records and process diagnostics for one persistent REA GDB session; truncation and invalid-UTF-8 fi..."},{"name":"close_gdb_session","description":"Close the owned GDB process after verifying the inferior state. When one live thread group has a verified durable output TTY, REA automatically detaches it,..."},{"name":"start_rizin_debug_session","description":"Start a persistent Rizin debugger session using `-N` to suppress user settings and scripts while retaining plugins, `-0` for NUL framing, and `-d` with an op..."},{"name":"rizin_debug_command","description":"Execute one unrestricted command in a persistent Rizin debugger session. Returns raw output inline with Evidence, including backend output interleaved before..."},{"name":"rizin_debug_session_status","description":"Return observed lifecycle state and bounded recent NUL-framed output and process diagnostics for one Rizin debugger session; truncation fields report discard..."},{"name":"close_rizin_debug_session","description":"Close the REA-owned Rizin debugger only after verifying no inferior remains or detaching one with a verified caller-selected TTY output sink. A detached targ..."},{"name":"inspect_packet_capture","description":"Inspect caller-selected fields in an existing local packet capture with TShark 4.x. Return 50 matching frames by default, with match_offset/match_limit pagin..."},{"name":"inspect_packet_fields","description":"Discover protocols or field names/types registered in the installed TShark 4.x. kind defaults to protocols; use fields and optional exact protocol abbreviati..."},{"name":"decode_signal_recording","description":"Decode an existing local logic/signal recording on Linux with sigrok-cli 0.7.2 and util-linux prlimit. Supply decoder stack, channels and options explicitly;..."},{"name":"inspect_signal_decoders","description":"Discover installed sigrok protocol decoders or inspect one decoder's channel/option help on Linux. Omit decoder to list ID/name pairs; supply its exact ID fo..."},{"name":"inspect_android_package","description":"Inspect a local APK's package, SDK and permission declarations, decoded manifest and class/resource counts, with a bounded static component projection. Omitt..."},{"name":"search_android_classes","description":"Search complete top-level decompiler class-name rows in an explicit local APK by case-sensitive substring. Empty query inventories all rows. Repeated names r..."},{"name":"inspect_android_class","description":"Inspect one exact Android class's parsed methods, fields and inner classes, including synthetic members. Returns display signatures, exact DEX prototypes and..."},{"name":"inspect_android_method","description":"Decompile one Android method with smali fallback. Requires explicit overload_index when multiple methods share a name. Reports its DEX prototype, representat..."},{"name":"trace_android_references","description":"Trace incoming static using nodes to an exact Android class or selected method overload. The total counts containing nodes, not individual invoke instruction..."},{"name":"inspect_jeb_client","description":"Inspect the running JEB client serving MCP: engine version, GUI or headless mode, and startup time. Does not open a target. Requires a caller-started JEB cli..."},{"name":"open_jeb_project","description":"Open or create a JEB project from an artifact file or existing .jdb2 database on the engine host. Returns the project's input-file digests and top-level unit..."},{"name":"list_jeb_units","description":"List project units by stable unit path and type, with optional wildcard filter, parent restriction, and pagination. The engine caps pages at 100 units; a ful..."},{"name":"decompile_jeb_item","description":"Decompile one type or method to engine pseudo-code using its decompiler (Dalvik, Java, or native). item_address comes from the engine's code item listing; un..."},{"name":"inspect_byte_entropy","description":"Inspect Shannon byte entropy for one explicit local file offline, without execution, extraction or external tools. Returns file-wide SHA-256 and entropy, fix..."},{"name":"insp
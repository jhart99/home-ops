# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# context7 resolves library docs upstream over HTTPS; ToolHive proxy accesses k8s API
# and forwards to the backend MCP pod.
# TODO(enforce phase): replace world:443 with the context7 API FQDNs seen in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: context7-allow-egress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: context7-mcp
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP

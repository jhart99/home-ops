---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: context7-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Context7"
    toolhive.stacklok.dev/registry-url: "http://mcp-context7-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "Up-to-date, version-specific documentation and code examples for libraries and frameworks via Context7."
    toolhive.stacklok.dev/tools: |
      ["resolve-library-id","query-docs"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"resolve-library-id","description":"Resolves a package/product name to a Context7-compatible library ID and returns matching libraries."},{"name":"query-docs","description":"Retrieves and queries up-to-date documentation and code examples from Context7 for any programming library or framework."}]
spec:
  image: ghcr.io/stacklok/dockyard/npx/context7:4.4.4
  transport: stdio
  proxyPort: 8080
  groupRef:
    name: mcp-tools
  permissionProfile:
    type: builtin
    name: network
  secrets:
    - name: context7-secret
      key: token
      targetEnvName: CONTEXT7_API_KEY
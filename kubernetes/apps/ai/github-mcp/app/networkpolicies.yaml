# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# GitHub REST/GraphQL API over HTTPS. ToolHive proxy connects to kube-apiserver
# and forwards to backend MCP pod on 8080.
# TODO(enforce phase): replace world:443 with api.github.com/github.com toFQDNs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-mcp-allow-egress
  namespace: ai
spec:
  endpointSelector:
    matchLabels:
      toolhive-name: github-mcp
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP

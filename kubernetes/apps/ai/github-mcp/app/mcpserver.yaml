---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "GitHub"
    toolhive.stacklok.dev/registry-url: "http://mcp-github-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "GitHub MCP server for managing repositories, issues, pull requests, workflows, and code search."
    toolhive.stacklok.dev/tools: |
      ["add_comment_to_pending_review","add_issue_comment","add_reply_to_pull_request_comment","assign_copilot_to_issue","create_branch","create_or_update_file","create_pull_request","create_repository","delete_file","fork_repository","get_commit","get_file_contents","get_label","get_latest_release","get_me","get_release_by_tag","get_tag","get_team_members","get_teams","issue_read","issue_write","list_branches","list_commits","list_issue_fields","list_issue_types","list_issues","list_pull_requests","list_releases","list_repository_collaborators","list_tags","merge_pull_request","pull_request_read","pull_request_review_write","push_files","request_copilot_review","search_code","search_commits","search_issues","search_pull_requests","search_repositories","search_users","sub_issue_write","ui_get","update_issue_comment","update_pull_request","update_pull_request_branch"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"add_comment_to_pending_review","description":"Add review comment to the requester's latest pending pull request review. A pending review needs to already exist to call this (check with the user if not su..."},{"name":"add_issue_comment","description":"Add a comment and/or reaction to a specific issue or issue comment in a GitHub repository. Use this tool with pull requests as well (in this case pass pull r..."},{"name":"add_reply_to_pull_request_comment","description":"Add a reply and/or reaction to an existing pull request comment. This can create a new comment linked as a reply to the specified comment, add an emoji react..."},{"name":"assign_copilot_to_issue","description":"Assign Copilot to a specific issue in a GitHub repository."},{"name":"create_branch","description":"Create a new branch in a GitHub repository"},{"name":"create_or_update_file","description":"Create or update a single file in a GitHub repository. "},{"name":"create_pull_request","description":"Create a new pull request in a GitHub repository."},{"name":"create_repository","description":"Create a new GitHub repository in your account or specified organization"},{"name":"delete_file","description":"Delete a file from a GitHub repository"},{"name":"fork_repository","description":"Fork a GitHub repository to your account or specified organization"},{"name":"get_commit","description":"Get details for a commit from a GitHub repository"},{"name":"get_file_contents","description":"Get the contents of a file or directory from a GitHub repository"},{"name":"get_label","description":"Get a specific label from a repository."},{"name":"get_latest_release","description":"Get the latest release in a GitHub repository"},{"name":"get_me","description":"Get details of the authenticated GitHub user. Use this when a request is about the user's own profile for GitHub. Or when information is missing to build oth..."},{"name":"get_release_by_tag","description":"Get a specific release by its tag name in a GitHub repository"},{"name":"get_tag","description":"Get details about a specific git tag in a GitHub repository"},{"name":"get_team_members","description":"Get member usernames of a specific team in an organization. Limited to organizations accessible with current credentials"},{"name":"get_teams","description":"Get details of the teams the user is a member of. Limited to organizations accessible with current credentials"},{"name":"issue_read","description":"Get information about a specific issue in a GitHub repository."},{"name":"issue_write","description":"Create a new or update an existing issue in a GitHub repository."},{"name":"list_branches","description":"List branches in a GitHub repository"},{"name":"list_commits","description":"Get list of commits of a branch in a GitHub repository. Returns at least 30 results per page by default, but can return more if specified using the perPage p..."},{"name":"list_issue_fields","description":"List issue fields for a repository or organization. Returns field definitions including name, type (text, number, date, single_select), and for single_select..."},{"name":"list_issue_types","description":"List supported issue types for a repository or its owner organization. When repo is omitted, returns org-level issue types directly."},{"name":"list_issues","description":"List issues in a GitHub repository. For pagination, use the 'endCursor' from the previous response's 'pageInfo' in the 'after' parameter."},{"name":"list_pull_requests","description":"List pull requests in a GitHub repository. If the user specifies an author, then DO NOT use this tool and use the search_pull_requests tool instead."},{"name":"list_releases","description":"List releases in a GitHub repository"},{"name":"list_repository_collaborators","description":"List collaborators of a GitHub repository. Results are paginated; the response includes `nextPage`, `prevPage`, `firstPage`, and `lastPage` fields. To get th..."},{"name":"list_tags","description":"List git tags in a GitHub repository"},{"name":"merge_pull_request","description":"Merge a pull request in a GitHub repository."},{"name":"pull_request_read","description":"Get information on a specific pull request in GitHub repository."},{"name":"pull_request_review_write","description":"Create and/or submit, delete review of a pull request."},{"name":"push_files","description":"Push multiple files to a GitHub repository in a single commit"},{"name":"request_copilot_review","description":"Request a GitHub Copilot code review for a pull request. Use this for automated feedback on pull requests, usually before requesting a human reviewer."},{"name":"search_code","description":"Fast and precise code search across ALL GitHub repositories using GitHub's native search engine. Best for finding exact symbols, functions, classes, or speci..."},{"name":"search_commits","description":"Search for commits across GitHub repositories using GitHub's commit search syntax. Useful for finding specific changes, authors, or messages across one or ma..."},{"name":"search_issues","description":"Search issues using natural-language semantic matching. Best for conceptual or paraphrased queries (e.g. \"login fails after password reset\"). Already scoped..."},{"name":"search_pull_requests","description":"Search for pull requests in GitHub repositories using issues search syntax already scoped to is:pr"},{"name":"search_repositories","description":"Find GitHub repositories by name, description, readme, topics, or other metadata. Perfect for discovering projects, finding examples, or locating specific re..."},{"name":"search_users","description":"Find GitHub users by username, real name, or other profile information. Useful for locating developers, contributors, or team members."},{"name":"sub_issue_write","description":"Add a sub-issue to a parent issue in a GitHub repository."},{"name":"ui_get","description":"Fetch UI data for MCP Apps (labels, assignees, milestones, issue types, branches, issue fields, reviewers)."},{"name":"update_issue_comment","description":"Update the body of an existing issue or pull request conversation comment. This tool cannot update pull request review comments."},{"name":"update_pull_request","description":"Update an existing pull request in a GitHub repository."},{"name":"update_pull_request_branch","description":"Update the branch of a pull request with the latest changes from the base branch."}]
spec:
  image: ghcr.io/github/github-mcp-server:v2.0.3@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    - name: GITHUB_API_URL
      value: https://api.github.com
    - name: LOG_LEVEL
      value: info
  secrets:
    - name: toolhive-github
      key: token
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  groupRef:
    name: mcp-tools

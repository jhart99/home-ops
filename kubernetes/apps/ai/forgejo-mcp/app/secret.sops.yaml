# forgejo-mcp access token - PLAINTEXT PLACEHOLDER, NOT ENCRYPTED YET.
# 1. Replace the value below with a real Forgejo access token
#    (Forgejo -> Settings -> Applications -> Access Tokens, repo/issue scopes).
# 2. Encrypt in place, then commit:
#      sops --encrypt --in-place kubernetes/apps/ai/forgejo-mcp/app/secret.sops.yaml
# Until step 2 lands, the forgejo-mcp Flux Kustomization cannot decrypt this file
# and will stay in an error state; nothing is deployed before then.
apiVersion: v1
kind: Secret
metadata:
  name: toolhive-forgejo
type: Opaque
stringData:
  token: "REPLACE_ME"

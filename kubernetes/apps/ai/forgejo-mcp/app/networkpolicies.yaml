# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# Forgejo REST API over HTTP, in-cluster service forgejo-http in namespace default.
# ToolHive proxy connects to kube-apiserver and forwards to backend MCP pod on 8080.
# TODO(enforce phase): scope this down to the forgejo-http endpoints instead of the
# whole default namespace, and widen it (world:443) if FORGEJO_URL is ever pointed
# at a public Forgejo host instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-mcp-allow-egress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: forgejo-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            toolhive-name: forgejo-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: default
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# kubelet /health probes (8080) from the node; toolhive gateways call the server.
# TODO(enforce phase): scope the cluster rule to the toolhive gateway/vmcp endpoints.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-mcp-allow-ingress
  namespace: ai
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      toolhive-name: forgejo-mcp
  ingress:
    # DNS return replies from kube-dns on ephemeral client ports
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: virtualmcpserver
        - matchLabels:
            app.kubernetes.io/name: hermes
        - matchLabels:
            toolhive-name: forgejo-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

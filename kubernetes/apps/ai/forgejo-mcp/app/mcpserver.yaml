    toolhive.stacklok.dev/registry-description: "Interact with self-hosted Forgejo repositories, issues, pull requests, actions, releases, and wikis."
    toolhive.stacklok.dev/tools: |
      ["add_issue_dependency","add_issue_labels","add_issue_time","add_repo_topic","add_team_member","add_team_repo","cancel_issue_stopwatch","cancel_workflow_run","change_files","check_notifications","check_org_membership","create_branch","create_branch_protection","create_comment_attachment","create_file","create_issue","create_issue_attachment","create_issue_comment","create_or_update_org_action_secret","create_or_update_repo_action_secret","create_org","create_org_label","create_org_team","create_pull_request","create_pull_review","create_release","create_release_attachment","create_repo","create_repo_hook","create_repo_label","create_review_requests","create_wiki_page","delete_branch","delete_branch_protection","delete_comment_attachment","delete_file","delete_issue_attachment","delete_issue_comment","delete_issue_time_entry","delete_org","delete_org_action_secret","delete_org_label","delete_package","delete_pull_review","delete_release","delete_release_attachment","delete_release_by_tag","delete_repo_action_secret","delete_repo_hook","delete_repo_label","delete_repo_topic","delete_review_requests","delete_wiki_page","delete_workflow_run","dismiss_pull_review","dispatch_workflow","download_comment_attachment","download_issue_attachment","download_release_attachment","edit_branch_protection","edit_comment_attachment","edit_issue_attachment","edit_issue_comment","edit_org","edit_org_label","edit_release","edit_release_attachment","edit_repo","edit_repo_hook","edit_repo_label","fork_repo","get_action_artifact","get_action_job_logs","get_branch_protection","get_comment_attachment","get_commit_statuses","get_file_content","get_forgejo_mcp_server_version","get_issue_attachment","get_issue_by_index","get_issue_comment","get_latest_release","get_my_user_info","get_notification_thread","get_org","get_org_label","get_package","get_pull_request_by_index","get_pull_request_diff","get_pull_review","get_release_attachment","get_release_by_id","get_release_by_tag","get_repo","get_repo_hook","get_repo_label","get_repo_tree","get_wiki_page","get_wiki_revisions","get_workflow_run","issue_state_change","list_action_run_artifacts","list_action_run_jobs","list_branch_protections","list_branches","list_comment_attachments","list_issue_attachments","list_issue_comments","list_issue_dependencies","list_issue_dependents","list_issue_tracked_times","list_my_orgs","list_my_repos","list_my_stopwatches","list_my_tracked_times","list_org_action_secrets","list_org_labels","list_org_members","list_org_teams","list_package_files","list_packages","list_pull_request_files","list_pull_review_comments","list_pull_reviews","list_release_attachments","list_releases","list_repo_action_secrets","list_repo_commits","list_repo_contents","list_repo_hooks","list_repo_issues","list_repo_labels","list_repo_milestones","list_repo_notifications","list_repo_pull_requests","list_repo_topics","list_repo_tracked_times","list_user_orgs","list_wiki_pages","list_workflow_runs","mark_all_notifications_read","mark_notification_read","mark_repo_notifications_read","merge_pull_request","remove_issue_dependency","remove_issue_labels","remove_org_member","remove_team_member","remove_team_repo","reset_issue_time","search_issues","search_org_teams","search_repos","search_users","set_repo_topics","start_issue_stopwatch","stop_issue_stopwatch","submit_pull_review","test_repo_hook","update_file","update_issue","update_pull_request","update_wiki_page"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"add_issue_dependency","description":"Make one issue depend on another issue. The issue identified by index will depend on depends_on_index. The dependency may live in a different repository (cro..."},{"name":"add_issue_labels","description":"Add labels to issue, by label name or numeric ID"},{"name":"add_issue_time","description":"Log time against an issue or pull request. Provide exactly one of 'seconds' or 'duration'."},{"name":"add_repo_topic","description":"Add one topic to a repository. The name is lowercased and must match Forgejo's topic rules."},{"name":"add_team_member","description":"Add a user to a team"},{"name":"add_team_repo","description":"Add a repository to a team"},{"name":"cancel_issue_stopwatch","description":"Cancel a running stopwatch without recording a tracked time entry"},{"name":"cancel_workflow_run","description":"Cancel a pending or running workflow run. Forgejo also returns 204 for a run that has already finished and leaves that run unchanged; that is success, not an..."},{"name":"change_files","description":"Atomically create, update, and delete multiple repository files in one native Forgejo commit. The complete batch is validated before the write; create/update..."},{"name":"check_notifications","description":"Check and list user notifications"},{"name":"check_org_membership","description":"Check if a user is a member of an organization"},{"name":"create_branch","description":"Create branch"},{"name":"create_branch_protection","description":"Create a branch protection rule (e.g. require status checks before merge)"},{"name":"create_comment_attachment","description":"Upload a new attachment to an issue/PR comment from exactly one of base64 content or a file path on the forgejo-mcp host."},{"name":"create_file","description":"Create file. Supply exactly one of `content` (plain text) or `content_base64` (strict standard Base64 representing exact bytes)."},{"name":"create_issue","description":"Create issue, optionally with labels (by name or ID), assignees and a milestone in the same call"},{"name":"create_issue_attachment","description":"Upload a new attachment to an issue or pull request from exactly one of base64 content or a file path on the forgejo-mcp host."},{"name":"create_issue_comment","description":"Create issue comment"},{"name":"create_or_update_org_action_secret","description":"Create or update an action secret for an organization. Overwrites any existing secret with the same name; the value is never echoed back."},{"name":"create_or_update_repo_action_secret","description":"Create or update an action secret for a repository. Overwrites any existing secret with the same name; the value is never echoed back."},{"name":"create_org","description":"Create an organization"},{"name":"create_org_label","description":"Create an organization-level label. Returns the created label including its numeric id, exclusive, and is_archived. exclusive=true requires a scoped name (a..."},{"name":"create_org_team","description":"Create a team in an organization"},{"name":"create_pull_request","description":"Create pull request"},{"name":"create_pull_review","description":"Create a pull request review with optional inline comments"},{"name":"create_release","description":"Create a release. If the tag does not yet exist, pass target_commitish so Forgejo creates the tag."},{"name":"create_release_attachment","description":"Upload an attachment to a release from exactly one of base64 content or a file path on the forgejo-mcp host."},{"name":"create_repo","description":"Create repo"},{"name":"create_repo_hook","description":"Create a repository webhook. The secret is accepted but never echoed in the response."},{"name":"create_repo_label","description":"Create a repository label. Returns the created label including its numeric id, exclusive, and is_archived. exclusive=true requires a scoped name (a '/' not a..."},{"name":"create_review_requests","description":"Request reviews from specific users or teams"},{"name":"create_wiki_page","description":"Create a wiki page. Slash-separated titles such as Parent/Child are a flat naming convention: Forgejo stores no parent-child relationship and does not create..."},{"name":"delete_branch","description":"Delete branch"},{"name":"delete_branch_protection","description":"Delete a branch protection rule by name"},{"name":"delete_comment_attachment","description":"Delete a comment attachment."},{"name":"delete_file","description":"Delete file"},{"name":"delete_issue_attachment","description":"Delete an issue/PR attachment."},{"name":"delete_issue_comment","description":"Delete issue/PR comment"},{"name":"delete_issue_time_entry","description":"Delete a single tracked time entry by its ID"},{"name":"delete_org","description":"Delete an organization. WARNING: This is destructive and irreversible \u2014 all repos, teams, and data will be permanently removed"},{"name":"delete_org_action_secret","description":"Delete an action secret from an organization."},{"name":"delete_org_label","description":"Delete an organization-level label. By default refuses if the label is in use; set delete_mode=force to override. Note: in-use count is best-effort over repo..."},{"name":"delete_package","description":"Delete one package version. Removes that version only, not every version of the name. No preflight GET. HTTP 204 returns {owner, type, name, version, status:..."},{"name":"delete_pull_review","description":"Delete a pending pull request review"},{"name":"delete_release","description":"Delete a release by numeric ID. Destructive."},{"name":"delete_release_attachment","description":"Delete a release attachment. Destructive."},{"name":"delete_release_by_tag","description":"Delete a release by tag name. Destructive \u2014 verify tag before calling."},{"name":"delete_repo_action_secret","description":"Delete an action secret from a repository."},{"name":"delete_repo_hook","description":"Delete a repository webhook by ID"},{"name":"delete_repo_label","description":"Delete a repository label. By default refuses if the label is in use; set delete_mode=force to override."},{"name":"delete_repo_topic","description":"Delete one topic from a repository."},{"name":"delete_review_requests","description":"Cancel pending review requests"},{"name":"delete_wiki_page","description":"Delete one wiki page by its server-normalized page_name."},{"name":"delete_workflow_run","description":"Delete a completed workflow run (succeeded, failed, or cancelled). The run is removed, its job logs become unreadable, and Forgejo marks that run's artifacts..."},{"name":"dismiss_pull_review","description":"Dismiss a pull request review"},{"name":"dispatch_workflow","description":"Trigger a workflow run"},{"name":"download_comment_attachment","description":"Download a comment attachment. Files at or above the inline cap return metadata + browser_download_url only; the caller is expected to fetch that URL with th..."},{"name":"download_issue_attachment","description":"Download an issue/PR attachment. Files at or above the inline cap return metadata + browser_download_url only; the caller is expected to fetch that URL with..."},{"name":"download_release_attachment","description":"Download a release attachment. Files at or above the inline cap return metadata + browser_download_url only; the caller is expected to fetch that URL with th..."},{"name":"edit_branch_protection","description":"Edit a branch protection rule. Only fields you pass are changed; omitted fields are left untouched."},{"name":"edit_comment_attachment","description":"Rename a comment attachment."},{"name":"edit_issue_attachment","description":"Rename an issue/PR attachment."},{"name":"edit_issue_comment","description":"Edit issue/PR comment"},{"name":"edit_org","description":"Edit organization settings"},{"name":"edit_org_label","description":"Edit an organization-level label (PATCH \u2014 only supplied fields change). Providing no fields is an error. Optional exclusive and is_archived; exclusive=true w..."},{"name":"edit_release","description":"Edit an existing release. Only fields supplied by the caller are sent to Forgejo."},{"name":"edit_release_attachment","description":"Rename a release attachment."},{"name":"edit_repo","description":"Edit repository settings (PATCH \u2014 only supplied fields change). Providing no fields is an error. name renames the repository; subsequent calls must use the n..."},{"name":"edit_repo_hook","description":"Edit a repository webhook. Only fields you pass are changed; omitted fields are left untouched."},{"name":"edit_repo_label","description":"Edit a repository label (PATCH \u2014 only supplied fields change). Providing no fields is an error. Optional exclusive and is_archived; exclusive=true with a new..."},{"name":"fork_repo","description":"Fork repo"},{"name":"get_action_artifact","description":"Get metadata for one Actions artifact (id, name, run_id, size_in_bytes, expired, timestamps, archive_download_url). Does not download the zip."},{"name":"get_action_job_logs","description":"Read a bounded byte range from a Forgejo v16+ workflow job's plaintext log. Omitting offset returns the tail. Continue backward with previous_offset and prev..."},{"name":"get_branch_protection","description":"Get a single branch protection rule by name"},{"name":"get_comment_attachment","description":"Get metadata for a single comment attachment."},{"name":"get_commit_statuses","description":"List per-context commit statuses for a full 40-character SHA. Bounded by page (default 1) and limit (default 30, maximum 50); returns {sha, statuses, page, l..."},{"name":"get_file_content","description":"Get file content as plain text by default. Set `with_metadata=true` for binary files, or when you need the SHA/encoding/links from the full `ContentsResponse..."},{"name":"get_forgejo_mcp_server_version","description":"Get MCP server version"},{"name":"get_issue_attachment","description":"Get metadata for a single issue/PR attachment."},{"name":"get_issue_by_index","description":"Get issue by index"},{"name":"get_issue_comment","description":"Get comment by ID"},{"name":"get_latest_release","description":"Get the latest non-draft, non-prerelease release."},{"name":"get_my_user_info","description":"Get user info"},{"name":"get_notification_thread","description":"Get detailed info on a single notification thread"},{"name":"get_org","description":"Get organization details"},{"name":"get_org_label","description":"Get a single organization-level label by ID. Includes exclusive and is_archived (false is present, not omitted)."},{"name":"get_package","description":"Get one package version (id, type, name, version, html_url, created_at, repository full_name). Does not embed owner or creator users."},{"name":"get_pull_request_by_index","description":"Get pull request by index"},{"name":"get_pull_request_diff","description":"Get the unified diff of a pull request. Pass an optional file_path to receive only the hunks for that file (match is exact on either the pre- or post-rename..."},{"name":"get_pull_review","description":"Get a specific pull request review"},{"name":"get_release_attachment","description":"Get metadata for a single release attachment."},{"name":"get_release_by_id","description":"Get a release by numeric ID."},{"name":"get_release_by_tag","description":"Get a release by tag name."},{"name":"get_repo","description":"Get a single repository by owner and name."},{"name":"get_repo_hook","description":"Get a single repository webhook by ID"},{"name":"get_repo_label","description":"Get a single repository label by ID. Includes exclusive and is_archived (false is present, not omitted)."},{"name":"get_repo_tree","description":"Get the Git tree of a repository. With recursive=true, returns the complete file tree in a single response (subject to the server's tree-endpoint size cap);..."},{"name":"get_wiki_page","description":"Get one wiki page as decoded Markdown. Optional start_line/end_line bound content; total_lines is always returned."},{"name":"get_wiki_revisions","description":"Get a wiki page's revision history with page/limit pagination; returns has_next and total_count, the page's total number of revisions as reported in the resp..."},{"name":"get_workflow_run","description":"Get details of a specific workflow run"},{"name":"issue_state_change","description":"Change issue state"},{"name":"list_action_run_artifacts","description":"List artifacts of a workflow run. Server-paged: page (default 1) and limit (default 30, maximum 50) are sent as query parameters, optional name filters by ar..."},{"name":"list_action_run_jobs","description":"List jobs for a Forgejo v16+ workflow run. Results are paged client-side because Forgejo returns the full job list."},{"name":"list_branch_protections","description":"List a repository's branch protection rules (bounded by page/limit)"},{"name":"list_branches","description":"List branches"},{"name":"list_comment_attachments","description":"List attachments on an issue/PR comment."},{"name":"list_issue_attachments","description":"List attachments on an issue or pull request."},{"name":"list_issue_comments","description":"List issue/PR comments"},{"name":"list_issue_dependencies","description":"List issues that the given issue depends on. Pagination uses page (1-based) and limit (page size); the response echoes page and limit so callers can fetch th..."},{"name":"list_issue_dependents","description":"List issues that depend on the given issue. Pagination uses page (1-based) and limit (page size); the response echoes page and limit so callers can fetch the..."},{"name":"list_issue_tracked_times","description":"List tracked time entries on an issue or pull request"},{"name":"list_my_orgs","description":"List my organizations"},{"name":"list_my_repos","description":"List my repos"},{"name":"list_my_stopwatches","description":"List all currently running stopwatches for the authenticated user"},{"name":"list_my_tracked_times","description":"List tracked time entries for the authenticated user across all repositories"},{"name":"list_org_action_secrets","description":"List action secrets for an organization (names only, values are never exposed by the Forgejo API)."},{"name":"list_org_labels","description":"List organization-level labels. Each label carries a scope field of \"org\", plus exclusive and is_archived (false is present, not omitted)."},{"name":"list_org_members","description":"List members of an organization"},{"name":"list_org_teams","description":"List teams in an organization"},{"name":"list_package_files","description":"List files of one package version. Forgejo returns the full file list with no paging; page (default 1) and limit (default 30, maximum 50) slice it client-sid..."},{"name":"list_packages","description":"List package versions for a user or org (Forgejo SearchVersions: one row per version, not one per name). Optional type and q filter; page (default 1) and lim..."},{"name":"list_pull_request_files","description":"List changed files in a pull request"},{"name":"list_pull_review_comments","description":"List comments on a pull request review"},{"name":"list_pull_reviews","description":"List reviews for a pull request"},{"name":"list_release_attachments","description":"List attachments on a release. The Forgejo API does not paginate this endpoint server-side, so the response is fetched in full and then sliced client-side; l..."},{"name":"list_releases","description":"List releases for a repository. The state filter is applied client-side after pagination, so result size may be smaller than limit even when more matches exi..."},{"name":"list_repo_action_secrets","description":"List action secrets for a repository (names only, values are never exposed by the Forgejo API)."},{"name":"list_repo_commits","description":"List repo commits"},{"name":"list_repo_contents","description":"List the files and directories at a given path in a repository. Use path=\"\" to list the repository root. Returns one level of entries at the specified path;..."},{"name":"list_repo_hooks","description":"List repository webhooks. page/limit control pagination (default: page 1, limit 30); no server-imposed ceiling. Returns total_count when Forgejo reports X-To..."},{"name":"list_repo_issues","description":"List repo issues"},{"name":"list_repo_labels","description":"List repository labels. When the owner is an organization and include_org_labels is true (default), org-level labels are merged into the response. Each label..."},{"name":"list_repo_milestones","description":"List repository milestones"},{"name":"list_repo_notifications","description":"Filter notifications scoped to a single repository"},{"name":"list_repo_pull_requests","description":"List repo pull requests"},{"name":"list_repo_topics","description":"List a repository's topics. Bounded by page (default 1) and limit (default 100); returns {topics, page, limit, count}."},{"name":"list_repo_tracked_times","description":"List tracked time entries across all issues and PRs in a repository"},{"name":"list_user_orgs","description":"List a user's organizations"},{"name":"list_wiki_pages","description":"List wiki pages with page/limit pagination; returns has_next and, when Forgejo reports X-Total-Count, total_count. total_count is upstream's count of raw wik..."},{"name":"list_workflow_runs","description":"List workflow runs for a repository"},{"name":"mark_all_notifications_read","description":"Acknowledge all notifications"},{"name":"mark_notification_read","description":"Mark a single notification thread as read"},{"name":"mark_repo_notifications_read","description":"Mark all notifications in a specific repo as read"},{"name":"merge_pull_request","description":"Merge a pull request"},{"name":"remove_issue_dependency","description":"Remove a dependency from the given issue. The dependency on dependency_index is removed from the issue identified by index. For a cross-repo dependency, pass..."},{"name":"remove_issue_labels","description":"Remove labels from issue, by label name or numeric ID"},{"name":"remove_org_member","description":"Remove a member from an organization"},{"name":"remove_team_member","description":"Remove a user from a team"},{"name":"remove_team_repo","description":"Remove a repository from a team"},{"name":"reset_issue_time","description":"Delete ALL tracked time entries on an issue or pull request (including entries from other users). This is destructive and cannot be undone."},{"name":"search_issues","description":"Search issues across every repository belonging to one owner (organization or user), without naming a repo. Returns a response envelope {issues, page, limit,..."},{"name":"search_org_teams","description":"Search org teams"},{"name":"search_repos","description":"Search repos"},{"name":"search_users","description":"Search users"},{"name":"set_repo_topics","description":"Replace all repository topics (comma-separated). The topics key is required; an empty string clears every topic. Names are lowercased. At most 25 topics, eac..."},{"name":"start_issue_stopwatch","description":"Start a stopwatch on an issue or pull request. Only one stopwatch per issue; fails if one is already running."},{"name":"stop_issue_stopwatch","description":"Stop a running stopwatch and record the elapsed time as a tracked time entry"},{"name":"submit_pull_review","description":"Submit a pending pull request review"},{"name":"test_repo_hook","description":"Trigger a test delivery for a repository webhook. WARNING: each call triggers a live HTTP delivery to the webhook URL."},{"name":"update_file","description":"Update file. Supply exactly one of `content` (plain text) or `content_base64` (strict standard Base64 representing exact bytes)."},{"name":"update_issue","description":"Update issue. 'set_labels' replaces the issue's whole label set; use add_issue_labels or remove_issue_labels to change it incrementally"},{"name":"update_pull_request","description":"Update pull request"},{"name":"update_wiki_page","description":"Update a wiki page. Writes are last-writer-wins; Forgejo provides no optimistic concurrency precondition."}]
spec:
  # Single-arch (linux/amd64) image published per release to the b4mad forge
  # container registry; anonymous pull works, no imagePullSecret required.
  image: git.b4mad.industries/agentic-forges/forgejo-mcp:v3.3.0@sha256:9ffdde38b9825666227676d1abbe410646014272fe9c317cb3435c0a6f3e5ad2
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  env:
    # In-cluster Forgejo HTTP API (service forgejo-http, port 3000, namespace default).
    # The server exits at startup if FORGEJO_URL is missing; --transport defaults to
    # stdio, which is what the toolhive proxy expects here.
    - name: FORGEJO_URL
      value: http://forgejo-http.default.svc.cluster.local:3000
  secrets:
    - name: toolhive-forgejo
      key: token
      targetEnvName: FORGEJO_ACCESS_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  groupRef:
    name: mcp-tools

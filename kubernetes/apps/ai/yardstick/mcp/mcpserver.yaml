---
# yaml-language-server: $schema=https://crd.movishell.pl/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: yardstick-mcp
  annotations:
    toolhive.stacklok.dev/registry-export: "true"
    toolhive.stacklok.dev/registry-title: "Yardstick"
    toolhive.stacklok.dev/registry-url: "http://mcp-yardstick-mcp-proxy.ai.svc.cluster.local:8080/mcp"
    toolhive.stacklok.dev/registry-description: "Deterministic MCP test and echo server for validating MCP transports and tool invocations."
    toolhive.stacklok.dev/tools: |
      ["echo"]
    toolhive.stacklok.dev/tool-definitions: |
      [{"name":"echo","description":"Echo back an alphanumeric string for deterministic testing. Also echoes back any _meta field from the request for testing metadata propagation."}]
spec:
  image: ghcr.io/stackloklabs/yardstick/yardstick-server:1.3.0
  transport: streamable-http
  env:
  - name: TRANSPORT
    value: streamable-http
  groupRef:
    name: mcp-tools
  proxyPort: 8080
  mcpPort: 8080
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets enableDefaultDeny to false - the selected
# endpoints stay default-allow while the allow-list is validated in Hubble. Enforcement
# is flipped on in a follow-up PR for this namespace.
---
# Known in-cluster dependencies from values: agentmemory (3111), searxng (8080),
# LiteLLM (4000), VirtualMCPServer proxy (4483), and Envoy Gateway for in-cluster
# routes (auth.rnatr.com OIDC on 443/10443). Outbound LLM/Matrix/OIDC/package
# traffic is HTTPS/HTTP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-allow-egress
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  egress:
    - toServices:
        - k8sService:
            serviceName: searxng
            namespace: ai
        - k8sService:
            serviceName: litellm
            namespace: ai
        - k8sService:
            serviceName: vmcp-mcp-gateway-internal
            namespace: ai
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: agentmemory
      toPorts:
        - ports:
            - port: "3111"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: searxng
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: virtualmcpserver
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    # In-cluster Envoy Gateway (OIDC discovery to auth.rnatr.com, internal APIs)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
    - toEntities:
        - world
      icmps:
        - fields:
            - type: 8
              family: IPv4
---
# Ingress: envoy-internal gateway serves the dashboard route (9119), kubelet probes
# /health on the gateway port (8642), in-cluster callers use the agent API (8642),
# and CoreDNS return packets arrive on client ephemeral ports.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-allow-ingress
  namespace: ai
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
            - port: "8642"
              protocol: TCP
    # kubelet liveness/readiness/startup probes (/health) arrive from the node
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8642"
              protocol: TCP
            - port: "9119"
              protocol: TCP

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermes-dind-server-tls
spec:
  secretName: hermes-dind-server-tls
  issuerRef:
    name: rnatr-internal-ca
    kind: ClusterIssuer
  commonName: hermes-dind
  # SANs must cover every name the hermes pod (and the daemon's own localhost
  # docker-info probe) uses to reach the API, or TLS verification fails.
  dnsNames:
    - hermes-dind
    - hermes-dind.ai
    - hermes-dind.ai.svc
    - hermes-dind.ai.svc.cluster.local
    - localhost
  usages:
    - server auth
    - digital signature
    - key encipherment
---
# Client cert presented by BOTH the hermes app (to reach the daemon) and by the
# daemon's own docker-info probes (which act as a TLS client to localhost:2376).
# Signed by the same CA as the server cert so the two trust each other.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermes-client-tls
spec:
  secretName: hermes-client-tls
  issuerRef:
    name: rnatr-internal-ca
    kind: ClusterIssuer
  commonName: hermes-client
  usages:
    - client auth
    - digital signature

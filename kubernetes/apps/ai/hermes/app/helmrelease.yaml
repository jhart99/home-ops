---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        type: deployment
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp -n /run/config/config.yaml /opt/data/config.yaml
                # Materialise the mTLS client cert for the remote rootless DinD
                # daemon from the cert-manager secret into the .pem filenames the
                # Docker CLI expects under DOCKER_CERT_PATH.
                mkdir -p /certs/client
                cp /run/clientcerts/tls.crt /certs/client/cert.pem
                cp /run/clientcerts/tls.key /certs/client/key.pem
                cp /run/clientcerts/ca.crt /certs/client/ca.pem
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 10000
              runAsUser: 10000
              seccompProfile:
                type: RuntimeDefault
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v0.21.6@sha256:55e192fba0cd4fde61142abbff5adeacff40efdb482ccd0ff877924bd274f909
              # repository: ghcr.io/jhart99/jhart99-hermes-agent
              # tag: v2026.9.24@sha256:073626546607edd4b74019bd1c2339fa3ab1100c6c7c44bf8f4bdf46bc4fb21c
            args:
              - gateway
              - run
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              DOCKER_CERT_PATH: /certs/client
              DOCKER_HOST: tcp://hermes-dind:2376
              DOCKER_TLS_VERIFY: "1"
              AGENTMEMORY_URL: http://agentmemory.ai.svc.cluster.local:3111
              GOPATH: /opt/data/go
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_TUI: "1"
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.rnatr.com
              HERMES_DASHBOARD_OIDC_ISSUER: https://auth.rnatr.com/application/o/hermes/
              HERMES_DASHBOARD_OIDC_CLIENT_ID: N9271Z49qmLhtX2bznf4Qc1eL83xvtCSWKyEJrHY
              HERMES_DASHBOARD_OIDC_REDIRECT_URI: https://hermes.rnatr.com/api/auth/oidc/callback
              HERMES_DASHBOARD_OIDC_SCOPES: openid profile email offline_access
              HERMES_GID: "10000"
              HERMES_HOME: /opt/data
              HERMES_UID: "10000"
              HOME: /opt/data
              PATH: /opt/data/.local/bin:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              PYTHONPATH: /opt/hermes/.venv/lib/python3.13/site-packages/
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              TERM: xterm-256color
              TZ: &tz America/New_York
              MATRIX_DEVICE_ID: HERMES_BOT
              MATRIX_RECOVERY_KEY_OUTPUT_FILE: /opt/data/matrix_recovery_key.txt
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  initialDelaySeconds: 5
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8642
                  failureThreshold: 60
                  periodSeconds: 5
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 4
                memory: 16Gi
            # PSS restricted-compliant: non-root, no privilege escalation, all
            # capabilities dropped, RuntimeDefault seccomp. NOTE: the official image
            # supervises the gateway with s6-overlay, which normally expects root at
            # boot - if the pod CrashLoops on deploy, the likely cause is s6 refusing
            # to start as non-root and the entrypoint will need to bypass s6 (set
            # command: to invoke the hermes binary directly). Left as a deliberate
            # PoC per the remediation plan.
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 10000
              runAsGroup: 10000
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
              readOnlyRootFilesystem: false

      # Rootless Docker-in-Docker, split into its own pod so the hermes pod above
      # can satisfy PSS restricted. Rootless DinD must create a user namespace,
      # which on this Talos cluster requires seccompProfile Unconfined - that is
      # forbidden under restricted (and PSS is evaluated per-pod), hence the split.
      # This pod therefore sits at PSS baseline (the ai namespace carries only
      # audit/warn labels, so a baseline pod is admitted).
      hermes-dind:
        strategy: Recreate
        replicas: 1
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          certs:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # Rename the cert-manager server cert into the .pem filenames the
                # dockerd entrypoint looks for under DOCKER_TLS_CERTDIR. Because the
                # files already exist the entrypoint skips self-generation and uses
                # the CA-signed cert (signed by rnatr-internal-ca), so the client
                # cert presented by the hermes pod validates against the same CA.
                mkdir -p /certs/server /certs/client
                cp /run/servercerts/tls.crt /certs/server/cert.pem
                cp /run/servercerts/tls.key /certs/server/key.pem
                cp /run/servercerts/ca.crt /certs/server/ca.pem
                chmod 644 /certs/server/*.pem
                # The daemon's own docker-info probes act as a TLS client to
                # localhost:2376; the entrypoint only exports the client env once
                # /certs/client/ca.pem exists, so stage the client cert here too.
                cp /run/clientcerts/tls.crt /certs/client/cert.pem
                cp /run/clientcerts/tls.key /certs/client/key.pem
                cp /run/clientcerts/ca.crt /certs/client/ca.pem
                chmod 644 /certs/client/*.pem
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
        containers:
          daemon:
            image:
              repository: docker
              tag: 29.9.0-dind-rootless
              # TODO: pin to a digest before merge - Renovate will propose one.
            env:
              DOCKER_TLS_CERTDIR: /certs
            securityContext:
              # Rootless, not privileged. Unconfined seccomp is REQUIRED for
              # rootlesskit to create the user namespace; this is the one field that
              # pins this pod to PSS baseline rather than restricted.
              allowPrivilegeEscalation: false
              privileged: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: Unconfined
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "docker"
                      - "info"
                  failureThreshold: 3
                  periodSeconds: 20
                  timeoutSeconds: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "docker"
                      - "info"
                  failureThreshold: 3
                  periodSeconds: 5
                  timeoutSeconds: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - "docker"
                      - "info"
                  failureThreshold: 60
                  periodSeconds: 2
                  timeoutSeconds: 3

    defaultPodOptions:
      nodeSelector: { kubernetes.io/arch: amd64 }

    service:
      app:
        controller: hermes
        ipFamilies:
          - IPv4
        ports:
          dashboard:
            port: 9119
          gateway:
            port: 8642
      dind:
        controller: hermes-dind
        ipFamilies:
          - IPv4
        ports:
          docker:
            port: 2376

    route:
      app:
        hostnames:
          - hermes.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      config-yaml:
        type: configMap
        name: hermes-configmap
        defaultMode: 0o755
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
      plugin-agentmemory:
        type: configMap
        name: hermes-agentmemory-plugin
        globalMounts:
          - path: /opt/hermes/plugins/agentmemory
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # mTLS client cert (signed by rnatr-internal-ca) presented by the hermes pod
      # to the rootless DinD daemon. Mounted read-only into the init container only,
      # which renames it into /certs/client for the app container.
      client-certs:
        type: secret
        name: hermes-client-tls
        defaultMode: 0o400
        advancedMounts:
          hermes:
            init:
              - path: /run/clientcerts
                readOnly: true
          hermes-dind:
            certs:
              - path: /run/clientcerts
                readOnly: true
      client-certs-tmp:
        type: emptyDir
        advancedMounts:
          hermes:
            init:
              - path: /certs/client
            app:
              - path: /certs/client
                readOnly: true
          hermes-dind:
            certs:
              - path: /certs/client
            daemon:
              - path: /certs/client
                readOnly: true
      # mTLS server cert (signed by rnatr-internal-ca) used by the DinD daemon.
      server-certs:
        type: secret
        name: hermes-dind-server-tls
        defaultMode: 0o400
        advancedMounts:
          hermes-dind:
            certs:
              - path: /run/servercerts
                readOnly: true
      server-certs-tmp:
        type: emptyDir
        advancedMounts:
          hermes-dind:
            certs:
              - path: /certs/server
            daemon:
              - path: /certs/server
                readOnly: true

    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - pods/log
                - nodes
                - services
                - namespaces
                - configmaps
                - persistentvolumes
                - persistentvolumeclaims
                - endpoints
                - resourcequotas
                - limitranges
                - serviceaccounts
                - events
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "apps"
              resources:
                - deployments
                - daemonsets
                - statefulsets
                - replicasets
                - controllerrevisions
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "batch"
              resources:
                - jobs
                - cronjobs
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "networking.k8s.io"
              resources:
                - ingresses
                - ingressclasses
                - networkpolicies
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "storage.k8s.io"
              resources:
                - storageclasses
                - csinodes
                - csidrivers
                - volumeattachments
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "helm.toolkit.fluxcd.io"
              resources:
                - helmreleases
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "kustomize.toolkit.fluxcd.io"
              resources:
                - kustomizations
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "source.toolkit.fluxcd.io"
              resources:
                - gitrepositories
                - helmrepositories
                - ocirepositories
                - buckets
                - helmcharts
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "external-secrets.io"
              resources:
                - externalsecrets
                - secretstores
                - clustersecretstores
              verbs:
                - "get"
                - "list"
                - "watch"
        hermes-pod-delete:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - "delete"
        hermes-exec-deploy:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - "create"
            - apiGroups:
                - "apps"
              resources:
                - deployments
              verbs:
                - "patch"
                - "update"
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-pod-delete:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-pod-delete
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-exec-deploy:
          type: RoleBinding
          roleRef:
            identifier: hermes-exec-deploy
          subjects:
            - identifier: hermes
              serviceAccount: hermes
              namespace: ai
    serviceAccount:
      hermes: {}

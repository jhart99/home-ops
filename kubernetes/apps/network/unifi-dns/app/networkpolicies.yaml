---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# NOTE: the selector uses app.kubernetes.io/instance because the external-dns
# charts derive app.kubernetes.io/name from the chart name (shared with the
# cloudflare-dns release).
# Allow external-dns (unifi provider) to resolve DNS via kube-dns
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns-allow-dns
  namespace: network
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow external-dns to reach the Kubernetes API server (it watches
# HTTPRoutes and Services).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns-allow-k8s-api
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow the external-dns main container to call its unifi webhook provider
# pod(s) in this namespace (the webhook calls the UniFi console API itself; see
# the separate egress rule below).
# TODO(enforce phase): confirm the webhook service port in Hubble (the sibling
# openwrt-dns chart uses 8888; this chart leaves it at chart default).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns-allow-webhook-egress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            app.kubernetes.io/instance: unifi-dns
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
# Allow the webhook provider container to reach the UniFi console API
# (UNIFI_HOST: https://unifi.jonathanrosshart.com).
# TODO(enforce phase): tighten `world` to the console's real address (a
# LAN-hosted hostname - candidate for toFQDN or a LAN CIDR rule) once observed
# in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns-allow-unifi-api-egress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Allow Prometheus to scrape external-dns metrics (serviceMonitor enabled,
# chart default metrics port 7979) and kubelet probes: main container on the
# metrics port, webhook container on its named port `http-webhook` (the values
# probes reference that name).
# TODO(enforce phase): confirm both probe ports in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns-allow-probes-scrape
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "7979"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "7979"
              protocol: TCP
            - port: "http-webhook"
              protocol: TCP

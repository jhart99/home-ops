---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
#
# This dir deploys two endpoint sets: the envoy-gateway control plane
# (label control-plane: envoy-gateway, per the ServiceMonitor selector) and the
# envoy data-plane proxies it deploys into this Gateway namespace
# (app.kubernetes.io/name: envoy + app.kubernetes.io/component: proxy, per the
# PodMonitor selector). The proxies are the cluster's ingress path for every
# HTTPRoute/TCPRoute/UDPRoute, so their fan-in is intentionally wide in audit
# mode.
# Allow kube-apiserver to reach the envoy-gateway admission webhooks (standard
# webhook port 9443).
# TODO(enforce phase): confirm the webhook port in Hubble.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-allow-webhook
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  ingress:
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
---
# Allow kubelet probes from the node and Prometheus scraping of the control
# plane metrics (ServiceMonitor envoy-gateway, port metrics 19001, probes 8081).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-allow-probes-scrape
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
---
# Allow the envoy data-plane proxies to stream xDS configuration to the
# envoy-gateway control plane on port 18000.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway-allow-xds-ingress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
---
# Allow the envoy proxies to receive xDS configuration from the envoy-gateway
# control plane (proxy -> control-plane stream).
# TODO(enforce phase): confirm the xDS port in Hubble (envoy-gateway default
# 18000) and pin the control-plane selector.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy-allow-xds-egress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
---
# Allow the envoy proxies to reach the backends behind every attached route
# (HTTPRoutes, TCPRoutes, and UDPRoutes across all namespaces, plus the cloudflare-tunnel origin).
# Pinned to the observed backend service ports to eliminate wildcard L3 fallthrough (match="all").
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy-allow-backend-egress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "2283"
              protocol: TCP
            - port: "3000"
              protocol: TCP
            - port: "3923"
              protocol: TCP
            - port: "4000"
              protocol: TCP
            - port: "4483"
              protocol: TCP
            - port: "5140"
              protocol: TCP
            - port: "5140"
              protocol: UDP
            - port: "7000"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8096"
              protocol: TCP
            - port: "8123"
              protocol: TCP
            - port: "8188"
              protocol: TCP
            - port: "8900"
              protocol: TCP
            - port: "9000"
              protocol: TCP
            - port: "9001"
              protocol: TCP
            - port: "9080"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9119"
              protocol: TCP
            - port: "9428"
              protocol: TCP
            - port: "9999"
              protocol: TCP
---
# Allow client ingress to the envoy proxies on the Gateway listener ports
# defined in envoy.yaml: http 80 (targetPort 10080), https 443 (targetPort 10443 TCP/UDP),
# syslog 5140 UDP and 5140 TCP (LoadBalancer IPs 192.168.30.7/8 plus in-cluster callers).
# Note: targetPorts 10080 and 10443 are essential because traffic evaluated at the pod endpoint
# has already undergone service translation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy-allow-listener-ingress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  ingress:
    - toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
            - port: "5140"
              protocol: UDP
            - port: "5140"
              protocol: TCP
---
# Allow Prometheus to scrape the envoy proxy metrics (PodMonitor envoy-proxy,
# port metrics 19001 and admin 19000) and kubelet probes from the node (ports 19002/19003).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy-allow-metrics-ingress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "19002"
              protocol: TCP
            - port: "19003"
              protocol: TCP
---
# Allow return traffic from kube-dns (UDP DNS replies to dynamic ephemeral client ports)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy-allow-return-ingress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns


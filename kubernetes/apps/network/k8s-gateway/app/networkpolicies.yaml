---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# AUDIT MODE (#1539): every policy below sets spec.enableDefaultDeny to false so
# the selected endpoints do NOT enter default-deny. The rules are computed and
# their matches are visible in Hubble, but non-matching traffic still passes.
# Enforcement is flipped on in a follow-up PR per namespace once the allow-list
# is validated against observed traffic.
# k8s-gateway is a CoreDNS-based split-horizon DNS server fronted by a
# LoadBalancer Service (192.168.1.6:53) that answers *.${SECRET_DOMAIN} from
# HTTPRoute/Service watches.
# Allow k8s-gateway to resolve DNS via kube-dns (its own forward/upstream path
# for names outside the watched zone).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway-allow-dns
  namespace: network
  annotations:
    # Marker for GitOps/audit tooling; Cilium itself does not read this
    # annotation - enableDefaultDeny below is the functional control.
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Allow k8s-gateway to reach the Kubernetes API server (it watches HTTPRoutes
# and Services to build its zone).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway-allow-k8s-api
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  egress:
    - toEntities:
        - kube-apiserver
---
# Allow DNS queries to k8s-gateway on 53 (UDP+TCP). Callers are the whole LAN
# via the LoadBalancer 192.168.1.6 (externalTrafficPolicy: Cluster, so traffic
# arrives from node entities) plus in-cluster resolvers - the set cannot be
# constrained without breaking DNS.
# TODO(enforce phase): confirm the caller set in Hubble; the enforce-time shape
# is likely "any -> :53" kept deliberately open, or restricted to node/LB
# entities + cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway-allow-dns-ingress
  namespace: network
  annotations:
    policy.cilium.io/audit-mode: "true"
spec:
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  ingress:
    - toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

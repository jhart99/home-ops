---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build REA MCP Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images/rea-mcp/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only - the image has no arm64 Ghidra decompiler to offer.
      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/rea-mcp:0.1.0 ./images/rea-mcp
          docker push ghcr.io/${{ github.repository_owner }}/rea-mcp:0.1.0

      - name: Print digest to pin
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/rea-mcp:0.1.0)"
          echo "Pin the MCPServer image field to: ${digest}"
